# Signed macOS stable channel.
# This intentionally duplicates the small base config instead of using
# `extends`, because electron-builder merges publish arrays in a way that can
# leave the app-update feed pointed at the public preview repository.
appId: com.agentlas.desktop
productName: Agentlas
copyright: © 2026 Agentlas

# agentlas:// URL 스킴 — 베이스 설정과 반드시 같은 값으로 유지한다(이 파일은 extends 하지 않는다).
protocols:
  - name: Agentlas
    schemes:
      - agentlas

directories:
  output: release
  buildResources: build-resources

beforePack: build-resources/before-pack-prepare.cjs
afterPack: build-resources/after-pack-clean.cjs
# The helper verifies the official bundle against
# build-resources/macos-release-signing-policy.json before it can leave a macOS build.
afterSign: build-resources/after-sign-trust.cjs

# Keep this exact immutable package marker in lockstep with the base official
# config. This standalone config intentionally does not inherit preview feed
# settings, but it must keep the official install namespaces.
extraMetadata:
  agentlasInstallIdentity:
    schemaVersion: 1
    channel: official
    appId: com.agentlas.desktop
    appName: Agentlas
    userDataNamespace: Agentlas
    keychainService: com.agentlas.desktop
    updateFeed: official

files:
  - dist/electron/**/*
  # Keep the main-process Astryx lock snapshot despite electron-builder's
  # global package-lock.json exclusion. It is required at app startup.
  - from: dist/electron/app-factory/astryx-lock
    to: dist/electron/app-factory/astryx-lock
    filter:
      - package-lock.json
  # dist/shared/** holds runtime values (shared/models.ts). MUST be packaged or the app crashes.
  - dist/shared/**/*
  - dist/renderer/**/*
  # dist/plugins/** holds the built-in plugin packages (manifest + SKILL.md + references).
  # electron/plugins/builtin.ts value-imports these manifests, so leaving them out ships an
  # app that throws "Cannot find module ../../plugins/agentlas-browser/plugin.json" at launch.
  # 1.0.32 shipped without this line because this config deliberately duplicates the base
  # config instead of extending it, and the rule was only added to the base.
  - dist/plugins/**/*
  - package.json
  - "!**/*.map"

asar: true
asarUnpack:
  # materializeBuiltinPlugins() must inspect real modes/symlinks rather than
  # Electron's synthetic ASAR fs.Stats (DEP0180).
  - "dist/plugins/**/*"
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/keytar/**/*"
  # node-pty loads its native addon and spawn-helper at runtime. electron-builder currently
  # auto-unpacks it as a detected native module, but the base config states this explicitly
  # and this duplicate must not depend on that autodetection staying true.
  - "**/node_modules/node-pty/**/*"

electronFuses:
  resetAdHocDarwinSignature: true
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# ── Embedded Hephaestus engine + mandatory pinned Python runtime ─────────────
# Keep the from/to/filter rules in sync with electron-builder.yml's extraResources.
# This file is a standalone (non-`extends`) duplicate, so without this block the
# signed/notarized mac release would ship WITHOUT the embedded engine.
extraResources:
  # 앱이 들고 다니는 Node+npm — 모든 플랫폼 공통.
  #
  # ★ 왜 여기(최상위)인가 (2026-08-24 실측):
  #   플랫폼 블록(mac:/win:)에 두면 설정 상속·중첩에서 같은 FileSet 이 두 번 적용되어
  #   `EEXIST … node-runtime/bin/npm` 으로 **빌드가 죽는다**(맥 Node 의 npm·npx·corepack 은
  #   심링크다). 최상위에 한 번만 두면 겹치지 않고, mac 블록을 비우는 로컬 후보 설정에서도
  #   살아남는다. filter 도 주지 않는다 — 주면 심링크를 파일로 한 번 더 복사하려 든다.
  #
  #   내용물은 빌드하는 플랫폼용으로 준비된다(맥 빌드=darwin, 윈도우 빌드=win).
  #   시스템에 설치하지도, 시스템 PATH 에 올리지도 않는다 — 앱이 자기 자식에게만 쓴다.
  - from: build-resources/node-runtime
    to: node-runtime
  # Release-owned public keys only. beforePack materializes this canonical file
  # from CI/environment policy; packaging fails closed when the policy is absent.
  - from: dist/product-extension-signing-policy.json
    to: product-extension-signing-policy.json
  # Automation must ship its own browser identity. Omitting this from the
  # standalone stable config silently forced installed builds back to the
  # user's system Chrome even though the base config was correct.
  - from: build-resources/browser-runtime
    to: browser-runtime
  - from: dist/embedded-core
    to: Hephaestus
    filter:
      - "**/*"
      - "!.git/**"
      - "!.git"
      - "!output/**"
      - "!tests/**"
      - "!benchmarks/**"
      - "!docs/**"
      - "!**/docs/**"
      - "!research/**"
      - "!examples/**"
      # Mirror after-pack-clean.cjs isForbiddenRuntimePath: development-only
      # segments and test/benchmark/fixture basenames are forbidden at ANY
      # depth, so an engine release that nests them (e.g. inside a plugin
      # bundle) must be filtered at copy time, not fail the packaging gate.
      - "!**/tests/**"
      - "!**/test/**"
      - "!**/benchmarks/**"
      - "!**/benchmark/**"
      - "!**/fixtures/**"
      - "!**/fixture/**"
      - "!**/findings/**"
      - "!**/evidence/**"
      - "!**/artifacts/**"
      - "!**/output/**"
      - "!**/test-*"
      - "!**/test_*"
      - "!**/*-test.*"
      - "!**/*_test.*"
      - "!**/*.test.*"
      - "!**/*benchmark*"
      - "!**/*fixture*"
      - "!**/*.log"
      - "!**/.codex/**"
      - "!**/.ontology-runtime/**"
      - "!.playwright-mcp/**"
      - "!.pytest_cache/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!**/.DS_Store"
      # Ignored local credentials/memory are outside the immutable Core commit.
      # Exclude them here as defense in depth; afterPack independently rejects
      # any matching path that reaches the packaged Resources tree.
      - "!**/.env"
      - "!**/.env.*"
      - "!**/*.pem"
      - "!**/*.key"
      - "!**/*.p12"
      - "!**/*.p8"
      - "!**/*.mobileprovision"
      - "!**/*.jks"
      - "!**/*.keystore"
      - "!**/signing/**"
      - "!**/credentials/**"
      - "!**/.memory.local/**"
      # Never ship project-local Context/Semantic/Career state from the engine
      # checkout. Re-include only the tracked product runtime contract.
      - "!.agentlas/**"
      - "!**/.agentlas/**"
      - ".agentlas/product-runtime-contract.json"
      - "!**/.ontology-runtime/**"
      - "!**/.codex/**"
      - "!**/.claude/settings.local.json"
      - "!**/.claude/settings.*.local.json"
      - "!**/*.log"
      - "!**/._*"
  # 필수 standalone Python. 패키징 직전 immutable SHA-256 asset을 다시 받고,
  # afterPack이 플랫폼/실행파일/tree 전체를 검증한다. 빈 디렉터리는 실패다.
  - from: build-resources/python-runtime
    to: python-runtime
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  # Startup Founder Studio 패키지(런처 + web/dist). base 설정과 동기화 유지.
  # Desktop runtime allowlist; validated again by studio-runtime-contract.cjs.
  - from: studio-pack
    to: studio-pack
    filter:
      - "scripts/open-studio-gui.py"
      - "clean-studio-data.json"
      - "templates/startup-brief.md"
      - "templates/founder-execution-packet.md"
      - "web/dist/index.html"
      - "web/dist/favicon.svg"
      - "web/dist/manifest.webmanifest"
      - "web/dist/assets/*.js"
      - "web/dist/assets/*.css"
  - from: build-resources/studio-runtime-manifest.json
    to: studio-pack/manifest.json

mac:
  category: public.app-category.productivity
  # This standalone release configuration must put the exact trust policy at
  # process.resourcesPath before the signed app is allowed to auto-update.
  extraResources:
    - from: build-resources/macos-release-signing-policy.json
      to: macos-release-signing-policy.json
    - from: build-resources/native/macos/agentlas-input-driver
      to: native/macos/agentlas-input-driver
  forceCodeSigning: true
  # Electron 43 requires macOS 12 Monterey or newer. The update feed pairs this
  # product-version floor with Darwin 21 in update-compatibility.cjs.
  minimumSystemVersion: "12.0"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  notarize: true
  # zip is REQUIRED for macOS auto-update (Squirrel.Mac updates from a .zip, not the .dmg).
  # dmg stays for first-time manual download/install.
  # NOTE: electron-builder 25.x writes latest-mac.yml referencing the .dmg even with both
  # targets, so scripts/fix-mac-latest-zip.mjs rewrites it to point at the .zip after build.
  target:
    - dmg
    - zip
  icon: build-resources/icon.icns
  artifactName: "Agentlas-${version}-${arch}.${ext}"

dmg:
  title: "${productName} ${version}"
  icon: build-resources/icon.icns
  iconSize: 96
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# 공개 릴리스 전용 채널: agentlas-desktop-releases. 소스 저장소 공개 여부와
# 무관하게 검증된 런타임 산출물만 게시한다. base 설정과 동일 채널을 유지한다.
publish:
  - provider: github
    owner: agentlas-ai
    repo: agentlas-desktop-releases
    private: false
    releaseType: release
