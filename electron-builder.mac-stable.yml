# Signed macOS stable channel.
# This intentionally duplicates the small base config instead of using
# `extends`, because electron-builder merges publish arrays in a way that can
# leave the app-update feed pointed at the public preview repository.
appId: com.agentlas.desktop
productName: Agentlas
copyright: © 2026 Agentlas

directories:
  output: release
  buildResources: build-resources

afterPack: build-resources/after-pack-clean.cjs

files:
  - dist/electron/**/*
  # dist/shared/** holds runtime values (shared/models.ts). MUST be packaged or the app crashes.
  - dist/shared/**/*
  - dist/renderer/**/*
  - package.json
  - "!**/*.map"

asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/keytar/**/*"

# ── Embedded Hephaestus engine + optional Python runtime ─────────────────────
# Keep the from/to/filter rules in sync with electron-builder.yml's extraResources.
# This file is a standalone (non-`extends`) duplicate, so without this block the
# signed/notarized mac release would ship WITHOUT the embedded engine.
extraResources:
  - from: Hephaestus
    to: Hephaestus
    filter:
      - "**/*"
      - "!.git/**"
      - "!.git"
      - "!output/**"
      - "!tests/**"
      - "!benchmarks/**"
      - "!examples/**"
      - "!.playwright-mcp/**"
      - "!.pytest_cache/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!**/.DS_Store"
  # 선택적 standalone Python. 비우면 시스템 python 폴백; `npm run fetch:python` 으로 채우면 동봉.
  - from: build-resources/python-runtime
    to: python-runtime
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  # Startup Founder Studio 패키지(런처 + web/dist). base 설정과 동기화 유지.
  - from: studio-pack
    to: studio-pack
    filter:
      - "**/*"
      - "!**/.studio-runtime/**"
      - "!**/.studio-runtime"
      - "!**/node_modules/**"
      - "!.git/**"
      - "!.git"
      - "!web/src/**"
      - "!web/node_modules/**"
      - "!web/dist/generated/**"
      - "!web/dist/studio-data.json"
      - "!web/public/generated/**"
      - "!web/public/studio-data.json"
      - "!.agentlas/**"
      - "!.agentlas"
      - "!field-test/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.map"
      - "!**/.DS_Store"

mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  notarize: true
  # zip is REQUIRED for macOS auto-update (Squirrel.Mac updates from a .zip, not the .dmg).
  # dmg stays for first-time manual download/install.
  # NOTE: electron-builder 25.x writes latest-mac.yml referencing the .dmg even with both
  # targets, so scripts/fix-mac-latest-zip.mjs rewrites it to point at the .zip after build.
  target:
    - dmg
    - zip
  icon: build-resources/icon.icns
  artifactName: "Agentlas-${version}-${arch}.${ext}"

dmg:
  title: "${productName} ${version}"
  icon: build-resources/icon.icns
  iconSize: 96
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# 배포 채널: 공개 "릴리스 전용" 레포(agentlas-desktop). 비공개 소스 레포라 컴파일된
# 바이너리만 공개 레포에 게시한다. (release.yml 의 base 설정과 동일 채널 유지)
publish:
  - provider: github
    owner: agentlas-ai
    repo: agentlas-desktop-releases
    private: false
    releaseType: release
