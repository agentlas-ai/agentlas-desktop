# electron-builder config — macOS first (V0). Windows는 V1 이후.
# Notarization은 build-resources/notarize-creds.json 또는 env var로 주입.
appId: com.agentlas.desktop
productName: Agentlas
copyright: © 2026 Agentlas

directories:
  output: release
  buildResources: build-resources

afterPack: build-resources/after-pack-clean.cjs

files:
  - dist/electron/**/*
  # dist/shared/** holds runtime values (shared/models.ts: BYOK_MODELS, context policy).
  # detect.ts/byok.ts value-import it, so it MUST be packaged or the app crashes at launch.
  - dist/shared/**/*
  - dist/renderer/**/*
  - cli/**/*
  - package.json
  - "!**/*.map"

asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/keytar/**/*"

# ── Embedded Hephaestus engine ───────────────────────────────────────────────
# Hephaestus is a separate open-source repo (git-ignored here). It is copied into
# the packaged app from the on-disk folder — independent of git tracking — so the
# private desktop repo never holds engine source while the shipped .app still
# embeds it. Lands at <app>/Contents/Resources/Hephaestus (process.resourcesPath),
# OUTSIDE the asar so bin/hephaestus + the Python tree stay executable.
# Heavy, non-runtime dirs (render output, tests, vendored caches, git) excluded.
extraResources:
  - from: Hephaestus
    to: Hephaestus
    filter:
      - "**/*"
      - "!.git/**"
      - "!.git"
      - "!output/**"
      - "!tests/**"
      - "!benchmarks/**"
      - "!examples/**"
      - "!.playwright-mcp/**"
      - "!.pytest_cache/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!**/.DS_Store"
  # 선택적 standalone Python 런타임. 기본은 빈 디렉터리(.gitkeep만) → 시스템 python 폴백.
  # `npm run fetch:python` 으로 현재 플랫폼용 python-build-standalone 을 채우면, 그대로 동봉되어
  # Python 미설치 머신에서도 엔진이 동작한다. 엔진 폴더가 아니라 데스크탑 리소스에 둔다(엔진 청결 유지).
  - from: build-resources/python-runtime
    to: python-runtime
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  # Startup Founder Studio 패키지 — 자체 GUI 런처 + 빌드된 SPA(web/dist). 앱이 런처를 spawn 해
  # 실제 스튜디오를 로컬 서빙하고 렌더러가 iframe 으로 띄운다. node_modules/소스/git 제외.
  - from: studio-pack
    to: studio-pack
    filter:
      - "**/*"
      - "!**/.studio-runtime/**"
      - "!**/.studio-runtime"
      - "!**/node_modules/**"
      - "!.git/**"
      - "!.git"
      - "!web/src/**"
      - "!web/node_modules/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.map"
      - "!**/.DS_Store"

# macOS first — Hardened Runtime + notarization 준비
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  notarize: true
  # zip is REQUIRED for macOS auto-update (Squirrel.Mac). dmg is for manual install.
  # electron-builder 25.x still writes the .dmg into latest-mac.yml, so the mac pipeline
  # runs scripts/fix-mac-latest-zip.mjs to repoint the feed at the .zip after build.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: build-resources/icon.icns
  artifactName: "Agentlas-${version}-${arch}.${ext}"

dmg:
  title: "${productName} ${version}"
  icon: build-resources/icon.icns
  iconSize: 96
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Windows — unsigned by default (no certificate needed to build or run).
# SmartScreen shows a one-time "More info → Run anyway"; the portable .exe runs
# without installing. Add CSC_LINK / CSC_KEY_PASSWORD in CI later to ship signed.
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build-resources/icon-1024.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 사람이 알아보기 쉬운 이름: OS + 아키텍처 + 종류
  artifactName: "Agentlas-${version}-Windows-x64-Setup.${ext}"

portable:
  artifactName: "Agentlas-${version}-Windows-x64-Portable.${ext}"

# Linux — unsigned. AppImage runs on any x64 distro (chmod +x then run);
# .deb for Debian/Ubuntu.
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  icon: build-resources/icon-1024.png
  artifactName: "Agentlas-${version}-Linux-x64.${ext}"

# 배포 채널: 공개 "릴리스 전용" 레포. 데스크탑 SOURCE 레포(agentlas-desktop)는 비공개라 공개
# 다운로드를 못 주므로, 컴파일된 바이너리만 이 공개 레포에 게시한다(소스 노출 없음). electron-builder
# 가 산출물 + latest*.yml 을 여기에 올리고 electron-updater 가 폴링한다.
# CI 는 AGENTLAS_DESKTOP_RELEASE_TOKEN(크로스-레포 PAT)으로 publish.
publish:
  - provider: github
    owner: agentlas-ai
    repo: agentlas-desktop-releases
    private: false
    releaseType: release
