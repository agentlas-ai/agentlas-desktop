# electron-builder config — macOS first (V0). Windows는 V1 이후.
# Notarization은 build-resources/notarize-creds.json 또는 env var로 주입.
appId: com.agentlas.desktop
productName: Agentlas
copyright: © 2026 Agentlas

# Pin the modern native packaging toolsets. The static AppImage runtime keeps
# the hosted Linux updater gate independent of FUSE 2, while the unified NSIS
# bundle carries the current Windows installer/runtime helpers. Both versions
# are checksum-pinned by the installed electron-builder release.
toolsets:
  appimage: 1.0.3
  nsis: 1.2.1

# agentlas:// URL 스킴 — 허브 웹의 "설치" 버튼이 여는 주소(agentlas://plugin/<family>/<slug>).
# 번들이 이 선언을 갖고 있어야 macOS 가 링크를 이 앱으로 넘긴다. 런타임 등록은
# electron/main.ts 의 registerAgentlasProtocolClient() 가 함께 한다 — 둘 다 필요하다.
protocols:
  - name: Agentlas
    schemes:
      - agentlas

directories:
  output: release
  buildResources: build-resources

beforePack: build-resources/before-pack-prepare.cjs
afterPack: build-resources/after-pack-clean.cjs
# The helper verifies the official bundle against
# build-resources/macos-release-signing-policy.json before it can leave a macOS build.
afterSign: build-resources/after-sign-trust.cjs

# This value is injected into app.asar/package.json. Runtime identity selection
# accepts only this complete marker; launch environment variables never select
# a packaged install namespace.
extraMetadata:
  agentlasInstallIdentity:
    schemaVersion: 1
    channel: official
    appId: com.agentlas.desktop
    appName: Agentlas
    userDataNamespace: Agentlas
    keychainService: com.agentlas.desktop
    updateFeed: official

files:
  - dist/electron/**/*
  # electron-builder globally excludes files named package-lock.json. This
  # lock snapshot is a runtime dependency used to materialize the pinned
  # Astryx app, so add it through a separate file-set matcher.
  - from: dist/electron/app-factory/astryx-lock
    to: dist/electron/app-factory/astryx-lock
    filter:
      - package-lock.json
  # dist/shared/** holds runtime values (shared/models.ts: BYOK_MODELS, context policy).
  # detect.ts/byok.ts value-import it, so it MUST be packaged or the app crashes at launch.
  - dist/shared/**/*
  - dist/renderer/**/*
  # dist/plugins/** holds the built-in plugin packages (manifest + SKILL.md + references).
  # materializeBuiltinPlugins() copies them to ~/.agentlas/plugins at boot, so leaving them
  # out ships an app whose plugins exist in dev and vanish in the packaged build.
  - dist/plugins/**/*
  - package.json
  - "!**/*.map"

asar: true
asarUnpack:
  # Plugin materialization hashes real modes and rejects symlinks. Reading the
  # source tree through Electron's ASAR fs shim fabricates fs.Stats (DEP0180),
  # so keep the exact release bytes on the real filesystem.
  - "dist/plugins/**/*"
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/keytar/**/*"
  # node-pty loads its native addon and spawn-helper at runtime. Keep the
  # complete package outside app.asar so both POSIX forkpty and Windows
  # ConPTY assets remain executable in the packaged app.
  - "**/node_modules/node-pty/**/*"

# Required workers still need the globally enabled ELECTRON_RUN_AS_NODE fuse;
# their internal call sites exact-gate command/argv. The fuse itself is not
# path-scoped. Generic Node option/inspector injection remains disabled. App
# code must come from app.asar; Electron validates its embedded integrity on
# supported macOS and Windows packages. Linux remains unsigned and ASAR-only.
electronFuses:
  resetAdHocDarwinSignature: true
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# ── Embedded Hephaestus engine ───────────────────────────────────────────────
# Hephaestus is a separate open-source repo (git-ignored here). beforePack keeps
# that checkout on its immutable pin, then deterministically materializes a
# receipt-bound Desktop runtime at dist/embedded-core with retired surfaces
# removed. Only that prepared tree enters the package. Lands at
# <app>/Contents/Resources/Hephaestus (process.resourcesPath),
# OUTSIDE the asar so bin/hephaestus + the Python tree stay executable.
# Heavy, non-runtime dirs (render output, tests, vendored caches, git) excluded.
extraResources:
  # 앱이 들고 다니는 Node+npm — 모든 플랫폼 공통.
  #
  # ★ 왜 여기(최상위)인가 (2026-08-24 실측):
  #   플랫폼 블록(mac:/win:)에 두면 설정 상속·중첩에서 같은 FileSet 이 두 번 적용되어
  #   `EEXIST … node-runtime/bin/npm` 으로 **빌드가 죽는다**(맥 Node 의 npm·npx·corepack 은
  #   심링크다). 최상위에 한 번만 두면 겹치지 않고, mac 블록을 비우는 로컬 후보 설정에서도
  #   살아남는다. filter 도 주지 않는다 — 주면 심링크를 파일로 한 번 더 복사하려 든다.
  #
  #   내용물은 빌드하는 플랫폼용으로 준비된다(맥 빌드=darwin, 윈도우 빌드=win).
  #   시스템에 설치하지도, 시스템 PATH 에 올리지도 않는다 — 앱이 자기 자식에게만 쓴다.
  - from: build-resources/node-runtime
    to: node-runtime
  # Release-owned public keys only. beforePack materializes this canonical file
  # from CI/environment policy; packaging fails closed when the policy is absent.
  - from: dist/product-extension-signing-policy.json
    to: product-extension-signing-policy.json
  # Playwright-pinned Chrome for Testing. This separate app identity prevents
  # headless automation from becoming the user's Chrome instance in Dock or
  # the Windows shell. Runtime code refuses to fall back to system browsers.
  - from: build-resources/browser-runtime
    to: browser-runtime
  - from: dist/embedded-core
    to: Hephaestus
    filter:
      - "**/*"
      - "!.git/**"
      - "!.git"
      - "!output/**"
      # Private project state. A developer whose Agentlas OS checkout has ever
      # been opened as a project carries .agentlas/ — ontology databases, the
      # project index, source lists — and without this the signed public app
      # would ship that personal data. ensure-engine.mjs refuses the build when
      # such files exist; this is what actually keeps them out.
      - "!.agentlas/**"
      - "!**/.agentlas/**"
      # ...except the one tracked, non-personal file: the engine's product
      # runtime contract. It shipped in 0.9.63 only because electron-builder's
      # matcher happens not to apply the exclusions above to this dotfile path;
      # re-include it explicitly so the outcome is a decision, not an accident.
      - ".agentlas/product-runtime-contract.json"
      - "!tests/**"
      - "!benchmarks/**"
      - "!docs/**"
      - "!**/docs/**"
      - "!research/**"
      - "!examples/**"
      # Mirror after-pack-clean.cjs isForbiddenRuntimePath: development-only
      # segments and test/benchmark/fixture basenames are forbidden at ANY
      # depth, so an engine release that nests them (e.g. inside a plugin
      # bundle) must be filtered at copy time, not fail the packaging gate.
      - "!**/tests/**"
      - "!**/test/**"
      - "!**/benchmarks/**"
      - "!**/benchmark/**"
      - "!**/fixtures/**"
      - "!**/fixture/**"
      - "!**/findings/**"
      - "!**/evidence/**"
      - "!**/artifacts/**"
      - "!**/output/**"
      - "!**/test-*"
      - "!**/test_*"
      - "!**/*-test.*"
      - "!**/*_test.*"
      - "!**/*.test.*"
      - "!**/*benchmark*"
      - "!**/*fixture*"
      - "!**/*.log"
      - "!**/.codex/**"
      - "!**/.ontology-runtime/**"
      - "!.playwright-mcp/**"
      - "!.pytest_cache/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!**/.DS_Store"
      # Ignored local credentials/memory are outside the immutable Core commit.
      # Exclude them here as defense in depth; afterPack independently rejects
      # any matching path that reaches the packaged Resources tree.
      - "!**/.env"
      - "!**/.env.*"
      - "!**/*.pem"
      - "!**/*.key"
      - "!**/*.p12"
      - "!**/*.p8"
      - "!**/*.mobileprovision"
      - "!**/*.jks"
      - "!**/*.keystore"
      - "!**/signing/**"
      - "!**/credentials/**"
      - "!**/.memory.local/**"
      # Preserve tracked .agentlas routing/ontology assets. Only Core's
      # git-ignored mutable runtime state is forbidden.
      - "!.agentlas/ontology-runtime.sqlite*"
      - "!.agentlas/career-graph.sqlite*"
      - "!.agentlas/experience-relations.jsonl*"
      - "!.agentlas/.experience-relations.jsonl.*"
      - "!.agentlas/field-test/**"
      - "!.agentlas/field-test-report.*"
      - "!.agentlas/agent-ontology/**"
      - "!**/.ontology-runtime/**"
      - "!**/.codex/**"
      - "!**/.claude/settings.local.json"
      - "!**/.claude/settings.*.local.json"
      - "!**/*.log"
      - "!**/._*"
  # 필수 standalone Python 런타임. release/package entrypoint가 정확한 플랫폼·SHA-256 자산을
  # 매 빌드 직전에 채우고 afterPack이 manifest/executable/tree/arch를 모두 검증한다.
  # 시스템 Python 폴백은 배포 계약이 아니며 빈 디렉터리는 패키징 실패다.
  - from: build-resources/python-runtime
    to: python-runtime
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  # Startup Founder Studio 패키지 — 자체 GUI 런처 + 빌드된 SPA(web/dist). 앱이 런처를 spawn 해
  # 실제 스튜디오를 로컬 서빙하고 렌더러가 iframe 으로 띄운다. node_modules/소스/git 제외.
  # Desktop runtime allowlist; validated again by studio-runtime-contract.cjs.
  - from: studio-pack
    to: studio-pack
    filter:
      - "scripts/open-studio-gui.py"
      - "clean-studio-data.json"
      - "templates/startup-brief.md"
      - "templates/founder-execution-packet.md"
      - "web/dist/index.html"
      - "web/dist/favicon.svg"
      - "web/dist/manifest.webmanifest"
      - "web/dist/assets/*.js"
      - "web/dist/assets/*.css"
  - from: build-resources/studio-runtime-manifest.json
    to: studio-pack/manifest.json

# macOS first — Hardened Runtime + notarization 준비
mac:
  category: public.app-category.productivity
  # Runtime auto-update trust reads this immutable policy from
  # process.resourcesPath. Keep it mac-scoped so Windows/Linux packaging never
  # treats a macOS signing rule as an update input.
  extraResources:
    - from: build-resources/macos-release-signing-policy.json
      to: macos-release-signing-policy.json
    - from: build-resources/native/macos/agentlas-input-driver
      to: native/macos/agentlas-input-driver
  forceCodeSigning: true
  # Electron 43 requires macOS 12 Monterey or newer. The update feed pairs this
  # product-version floor with Darwin 21 in update-compatibility.cjs.
  minimumSystemVersion: "12.0"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  notarize: true
  # zip is REQUIRED for macOS auto-update (Squirrel.Mac). dmg is for manual install.
  # electron-builder 25.x still writes the .dmg into latest-mac.yml, so the mac pipeline
  # runs scripts/fix-mac-latest-zip.mjs to repoint the feed at the .zip after build.
  target:
    - dmg
    - zip
  icon: build-resources/icon.icns
  artifactName: "Agentlas-${version}-${arch}.${ext}"

dmg:
  title: "${productName} ${version}"
  icon: build-resources/icon.icns
  iconSize: 96
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Windows — unsigned by default (no certificate needed to build or run).
# SmartScreen shows a one-time "More info → Run anyway"; the portable .exe runs
# without installing. Add CSC_LINK / CSC_KEY_PASSWORD in CI later to ship signed.
win:
  # The runtime itself is copied once by the top-level extraResources block.
  # Windows needs one supplement: electron-builder refuses to traverse a FileSet
  # whose root child is named node_modules, and the Windows Node distribution
  # keeps npm there (macOS keeps it under lib/, which needs no supplement).
  extraResources:
    # electron-builder intentionally refuses to traverse a FileSet whose root
    # child is named node_modules. Copy the immutable official Node distribution's
    # module tree from that directory as its own FileSet so npm/Corepack survive.
    - from: build-resources/node-runtime/node_modules
      to: node-runtime/node_modules
      filter:
        - "**/*"
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build-resources/icon-1024.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 사람이 알아보기 쉬운 이름: OS + 아키텍처 + 종류
  artifactName: "Agentlas-${version}-Windows-x64-Setup.${ext}"

portable:
  artifactName: "Agentlas-${version}-Windows-x64-Portable.${ext}"

# Linux — unsigned. AppImage runs on any x64 distro (chmod +x then run);
# .deb for Debian/Ubuntu.
linux:
  # Keep the public Linux package contact separate from package.json so app.asar
  # never embeds a developer's private email or source-repository metadata.
  maintainer: "Agentlas <support@agentlas.cloud>"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  icon: build-resources/icon-1024.png
  artifactName: "Agentlas-${version}-Linux-x64.${ext}"

# 공개 릴리스 채널은 소스 저장소와 별개다. 소스 저장소 공개 여부와 무관하게
# 검증된 런타임 산출물만 게시한다. electron-builder가 산출물 + latest*.yml을
# 여기에 올리고 electron-updater가 폴링한다.
# CI 는 AGENTLAS_DESKTOP_RELEASE_TOKEN(크로스-레포 PAT)으로 publish.
publish:
  - provider: github
    owner: agentlas-ai
    repo: agentlas-desktop-releases
    private: false
    # Windows/Linux are staging artifacts. The signed macOS publisher verifies
    # every required platform asset before it alone promotes stable/latest.
    releaseType: prerelease
