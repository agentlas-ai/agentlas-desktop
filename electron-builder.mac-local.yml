# Explicit local/QA macOS packaging boundary.
#
# Do not use the official base config with identity=null. This configuration
# gives the candidate its own macOS bundle, Electron userData namespace,
# Keychain service, output directory, and deliberately no update publisher.
extends: ./electron-builder.yml

appId: com.agentlas.desktop.candidate
productName: Agentlas-Local-Candidate

directories:
  output: release-local

afterSign: build-resources/after-sign-trust.cjs

extraMetadata:
  agentlasInstallIdentity:
    schemaVersion: 1
    channel: local-candidate
    appId: com.agentlas.desktop.candidate
    appName: Agentlas-Local-Candidate
    userDataNamespace: Agentlas-Local-Candidate
    keychainService: com.agentlas.desktop.candidate
    updateFeed: none

# Keep the native Computer Use helper in QA candidates through the global
# resource list. The mac-scoped list below must remain cleared so the official
# update-signing policy inherited from the base config cannot enter this app.
extraResources:
  - from: build-resources/native/macos/agentlas-input-driver
    to: native/macos/agentlas-input-driver

mac:
  # electron-builder extends the base mac config. Null clears only the
  # platform-scoped official trust policy; top-level extraResources (embedded
  # engine, python runtime, **the bundled Node**) stay intact.
  #
  # ★ 2026-08-24: 여기에 리소스를 다시 나열하면 베이스 것과 겹쳐 같은 FileSet 이 두 번
  #   복사되고 `EEXIST … node-runtime/bin/npm` 으로 빌드가 죽는다. 번들 Node 를 최상위로
  #   옮긴 이유다 — 이 자리를 비워도 로컬 후보에 그대로 들어간다.
  extraResources: null
  identity: null
  notarize: false
  forceCodeSigning: false
  target:
    - dir
  artifactName: "Agentlas-Local-Candidate-${version}-${arch}.${ext}"

# A local candidate must not emit app-update.yml or publish an artifact.
publish: null
