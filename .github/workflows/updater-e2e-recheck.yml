name: Native Updater E2E Recheck

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed release run whose exact Windows/Linux artifacts must be rechecked"
        required: true
      target_version:
        description: "Stable target version embedded in those artifacts"
        required: true
        default: "0.8.38"

permissions:
  contents: read
  actions: read

jobs:
  native-updater-e2e:
    name: Recheck native updater (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            artifact_os: Windows
            label: Windows NSIS
          - os: ubuntu-latest
            platform: linux
            artifact_os: Linux
            label: Linux AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux native updater dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev xvfb xauth dbus-x11

      - name: Install updater E2E dependencies
        run: npm ci

      - name: Configure Linux updater relaunch sandbox
        if: runner.os == 'Linux'
        run: |
          node node_modules/electron/install.js
          sandbox_path="$(find node_modules/electron -maxdepth 4 -name chrome-sandbox -print -quit)"
          if [ -z "$sandbox_path" ]; then
            echo "::error::Electron Linux binary installed without the required chrome-sandbox helper."
            exit 1
          fi
          sandbox_path="$(realpath "$sandbox_path")"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          test "$(stat -c '%U:%G:%a' "$sandbox_path")" = "root:root:4755"
          echo "CHROME_DEVEL_SANDBOX=$sandbox_path" >> "$GITHUB_ENV"
          echo "Configured inherited Electron SUID sandbox helper: $sandbox_path"

      - name: Download exact prior release artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          name: agentlas-release-${{ matrix.artifact_os }}
          path: release

      - name: Recheck native updater lifecycle without publishing
        shell: bash
        env:
          CI: "true"
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          args=(
            scripts/test-packaged-updater-install-e2e.cjs
            --platform="${{ matrix.platform }}"
            --artifact-dir=release
            --target-version="$TARGET_VERSION"
            --timeout-ms=180000
          )
          if [ "${{ matrix.platform }}" = "linux" ]; then
            dbus-run-session -- xvfb-run -a node "${args[@]}"
          else
            node "${args[@]}"
          fi
