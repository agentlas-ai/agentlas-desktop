name: Dependency Security Audit

on:
  workflow_dispatch:
  schedule:
    # 05:17 KST. Avoid the top of the hour, when scheduled Actions are busiest.
    - cron: "17 20 * * *"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-security.yml"

concurrency:
  group: desktop-dependency-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: High-severity dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
      - name: Audit the immutable lockfile without installing native dependencies
        run: npm audit --package-lock-only --audit-level=high
