          ];
          for (const gate of gates) {
            const env = { ...process.env };
            if (gate.main) delete env.ELECTRON_RUN_AS_NODE;
            const command = gate.main ? require('electron') : process.execPath;
            const argv = gate.path === 'scripts/test-toolchain-apps.cjs' ? ['--experimental-sqlite', gate.path] : [gate.path];
              const result = cp.spawnSync(command, argv, { cwd: process.cwd(), env, stdio: 'inherit', timeout: 120000 });
            if (result.error || result.status !== 0) throw new Error(`Required private gate failed: ${gate.path}; code=${result.status}; signal=${result.signal}; error=${result.error?.code || ''}`);
