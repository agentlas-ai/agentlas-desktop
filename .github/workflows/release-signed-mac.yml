name: Release Signed macOS

# Two ways to trigger:
#   1. Push a stable tag matching v*.*.*  -> automatic signed macOS release
#   2. Manual via GitHub UI / `gh workflow run` with explicit version/tag
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop package version to release"
        required: true
      tag:
        description: "GitHub release tag"
        required: true
      draft:
        description: "Create or keep the GitHub release as draft"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      apply_web_env:
        description: "Apply verified desktop release env vars to Railway production"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  actions: read

jobs:
  cross-platform-release-build:
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      harness_ref: ${{ github.sha }}

  mac-release-preflight:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Publish installers to the SEPARATE public releases repository.
      AGENTLAS_DESKTOP_GITHUB_REPO: agentlas-ai/agentlas-desktop-releases
      AGENTLAS_PUBLIC_RELEASE: "1"
      AGENTLAS_MAC_UPDATE_HISTORY_COUNT: "2"
      AGENTLAS_MAC_UPDATE_HISTORY_CACHE_DIR: ${{ github.workspace }}/.release-cache/agentlas-mac-update-history
      HEPHAESTUS_REF: v1.1.38
      HEPHAESTUS_COMMIT: 23f441d3f3ea8db126103475a5c4857148c8ce0b

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable Mac release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: |
            scripts/package-mac.sh
            scripts/verify-mac-update-lineage.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify and install immutable Mac release tooling
        run: |
          tooling_commit="$(git -C .release-tooling rev-parse HEAD)"
          if [ "$tooling_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Mac release tooling checkout does not match immutable workflow commit."
            exit 1
          fi
          cp .release-tooling/scripts/package-mac.sh scripts/package-mac.sh
          cp .release-tooling/scripts/verify-mac-update-lineage.mjs scripts/verify-mac-update-lineage.mjs
          chmod +x scripts/package-mac.sh scripts/verify-mac-update-lineage.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve release inputs
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          RAW_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'false' }}
          RAW_APPLY_WEB_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_web_env || 'true' }}
        run: |
          tag="$RAW_TAG"
          version="${RAW_VERSION:-${tag#v}}"
          draft="$RAW_DRAFT"
          apply_web_env="$RAW_APPLY_WEB_ENV"
          if [ -z "$version" ] || [ -z "$tag" ]; then
            echo "::error::version/tag could not be resolved (tag=$tag, version=$version)"
            exit 1
          fi
          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$tag" =~ $semver_tag_re ]]; then
            echo "::error::Release tag must be stable SemVer with a leading v and no prerelease suffix (received: $tag)."
            exit 1
          fi
          if [ "$version" != "${tag#v}" ]; then
            echo "::error::Version $version does not match release tag $tag."
            exit 1
          fi
          if [ "$draft" != "true" ] && [ "$draft" != "false" ]; then
            echo "::error::draft must be true or false."
            exit 1
          fi
          if [ "$apply_web_env" != "true" ] && [ "$apply_web_env" != "false" ]; then
            echo "::error::apply_web_env must be true or false."
            exit 1
          fi
          tagged_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")" || {
            echo "::error::Release tag $tag does not exist in refs/tags."
            exit 1
          }
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tagged_commit" ]; then
            echo "::error::Checked-out HEAD $head_commit does not match $tag ($tagged_commit)."
            exit 1
          fi
          pkgver=$(node -p "require('./package.json').version")
          lockver=$(node -p "require('./package-lock.json').version")
          lockrootver=$(node -p "require('./package-lock.json').packages[''].version")
          runtimever=$(node -p "require('./package.json').agentlasUpdateCompatibility.bundledRuntimeVersion")
          runtimecommit=$(node -p "require('./package.json').agentlasBundledRuntimeSource.commit")
          if [ "$pkgver" != "$version" ] || [ "$lockver" != "$version" ] || [ "$lockrootver" != "$version" ]; then
            echo "::error::Tag $tag requires package.json/package-lock root version=$version (got package=$pkgver lock=$lockver root=$lockrootver)."
            exit 1
          fi
          if [ "${HEPHAESTUS_REF#v}" != "$runtimever" ]; then
            echo "::error::HEPHAESTUS_REF=$HEPHAESTUS_REF does not match bundledRuntimeVersion=$runtimever."
            exit 1
          fi
          if [ "$HEPHAESTUS_COMMIT" != "$runtimecommit" ]; then
            echo "::error::HEPHAESTUS_COMMIT does not match package immutable runtime pin."
            exit 1
          fi
          {
            echo "RESOLVED_TAG=$tag"
            echo "RESOLVED_VERSION=$version"
            echo "RESOLVED_DRAFT=$draft"
            echo "RESOLVED_APPLY_WEB_ENV=$apply_web_env"
            echo "AGENTLAS_DESKTOP_RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"
          echo "::notice::Releasing tag=$tag version=$version draft=$draft apply_web_env=$apply_web_env"

      - name: Assert required release secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_DEVELOPER_ID_CERTIFICATE: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          GH_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$MAC_DEVELOPER_ID_CERTIFICATE"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$GH_TOKEN"

      - name: Install pinned Railway CLI
        if: env.RESOLVED_APPLY_WEB_ENV == 'true'
        run: npm install -g @railway/cli@5.26.0

      - name: Check Railway release credentials
        if: env.RESOLVED_APPLY_WEB_ENV == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ] && [ -n "$RAILWAY_PROJECT_ID" ] && npm run release:railway:check -- --project="$RAILWAY_PROJECT_ID" --environment=production --service=agentlas-web; then
            echo "AGENTLAS_RAILWAY_RELEASE_READY=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Railway release env credentials are missing or invalid. macOS release will still publish; apply desktop web env manually after release."
            echo "AGENTLAS_RAILWAY_RELEASE_READY=0" >> "$GITHUB_ENV"
          fi

      # Clone the git-ignored Hephaestus engine so the signed .app embeds it.
      - name: Ensure embedded engine (Hephaestus)
        run: npm run ensure:engine

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Agent Workforce Ontology orchestration
        run: |
          npm run test:workforce-orchestrator
          npm run test:hephaestus-settings-migration
          npm run test:auto-router-gates

      - name: Verify embedded Stormbreaker harness
        run: |
          npm run test:stormbreaker-core:embedded
          npm run test:stormbreaker-swarm

      - name: Verify signed-resource Python cache boundary
        run: npm run test:python-cache-boundary

      - name: Verify Project Foundation write and privacy boundary
        run: npm run test:release-agent-foundation-gate

      # 실제 장애가 난 Browser 소유권/스크롤, 자동화 파이프/watchdog와
      # typecheck만으로 못 잡았던 Hub·Runtime Readiness UI 회귀를 함께 막는다.
      - name: Runtime, browser, and renderer UI regression gates
        run: |
          # OpenCrab/Site/Browser UI gates launch Playwright. Fresh runners do
          # not have a browser cache, so install before the first UI test.
          npx playwright install chromium
          npm run test:automation-scheduler-guards
          npm run test:automation-trigger-safety
          npm run test:v52-automation-run-recovery
          npm run test:v64-automation-permission-migration
          npm run test:v53-hub-bookmark-sync
          npm run test:updater-production
          npm run test:updater-ui
          npm run test:automations-store
          npm run test:automation-result-contract
          npm run test:runtime-stdin-epipe
          npm run test:cli-version-parser
          npm run test:hephaestus-status-version
          npm run test:marketplace-cache
          npm run test:after-pack-runtime-contract
          npm run test:mobile-bridge-contract
          npm run test:mobile-read-boundary
          npm run test:mobile-execution-boundary
          npm run test:runtime-resume-contract
          npm run test:cli-image-attachments
          npm run test:owned-agent-runtime-prompts
          npm run test:borrowed-task-force
          npm run test:mcp-auto-select
          npm run test:mcp-secret-isolation
          npm run test:opencrab-core
          npm run test:opencrab-product
          npm run test:opencrab-recovery-scrub
          npm run test:mock-bridge-parity
          npm run test:opencrab-ui
          npm run test:build-session-contracts
          npm run test:build-cloud-save-choice
          npm run test:hephaestus-sync
          npm run test:local-import
          npm run test:site-studio
          npm run test:chat-session-reset
          npm run test:trex-locale
          npm run test:browser-approval-gate
          npm run test:browser-approval-concurrency
          npm run test:browser-legacy-credential-scrub
          npm run test:browser-profile-isolation
          npm run test:browser-password-boundary
          npm run test:browser-ui
          npm run smoke:renderer-ui
          node scripts/qa-provider-health-dashboard.cjs
          node scripts/test-desktop-feature-surfaces.cjs --build-roster-sync-only
          npm run test:hub-bookmark-ux
          node scripts/test-hub-bookmark-ui.cjs
          node scripts/test-runtime-readiness-ui.cjs
          npm run test:independent-terminal-boundary
          npm run test:grok-runtime-contract
          npm run test:provider-health
          npm run test:grok-auth-source
          npm run test:oberon-provider-routing
          npm run test:telegram-connect-atomicity
          npm run test:telegram-api-timeout
          npm run test:telegram-automation-report-fanout
          npm run test:document-studio-draft-persistence
          npm run test:prompts-start-failure-ui
          npm run test:settings-resilience-ui
          npm run test:engine-auto-toggle-ui
          npm run test:startup-founder-new-idea
          npm run test:trex-ui
          npm run test:trex-attachments-ui
          node scripts/qa-chat-input-routing.cjs
          AGENTLAS_QA_LOCALE=en node scripts/qa-chat-input-routing.cjs
          npm run test:all-routes-ui

      - name: Experience Ontology release gates
        env:
          AGENTLAS_E2E: "1"
        run: |
          npm run build:electron
          node scripts/test-model2vec-hybrid-parity.cjs
          npx --no-install electron scripts/test-memory-hybrid-retrieval.cjs
          npx --no-install electron scripts/test-curator-nest-core-query.cjs
          npx --no-install electron scripts/test-memory-agent-isolation.cjs
          node scripts/test-memory-context-budget.cjs
          npx --no-install electron scripts/test-agent-learning-v57.cjs
          npx --no-install electron scripts/test-legacy-experience-reconciliation.cjs
          npx --no-install electron scripts/test-v58-memory-curation-migration.cjs
          npx --no-install electron scripts/test-v59-ontology-binding-migration.cjs
          npm run test:terminal-ontology-loadout-feed
          npx --no-install electron scripts/test-experience-p0.cjs
          npx --no-install electron scripts/test-experience-taxonomy-parity.cjs
          npx --no-install electron scripts/test-v55-experience-relations-migration.cjs
          npx --no-install electron scripts/test-experience-relation-index.cjs
          node scripts/test-portable-experience-hash-golden.cjs
          npx --no-install electron scripts/test-v56-experience-cloud-migration.cjs
          npx --no-install electron scripts/test-experience-cloud-exchange.cjs
          npx --no-install electron scripts/test-mobile-ontology-bridge.cjs
          npm run build:renderer
          node scripts/test-desktop-feature-surfaces.cjs --memory-evolution-only
          node scripts/test-desktop-feature-surfaces.cjs --experience-only
          node scripts/test-ontology-feature-update.cjs

      - name: Record successful macOS release preflight
        run: echo "macOS release tests completed without publishing any release assets"

  release-artifact-barrier:
    name: All OS release gate barrier
    if: ${{ always() }}
    needs:
      - cross-platform-release-build
      - mac-release-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Require every OS gate and package job
        env:
          CROSS_PLATFORM_RESULT: ${{ needs.cross-platform-release-build.result }}
          MAC_PREFLIGHT_RESULT: ${{ needs.mac-release-preflight.result }}
        run: |
          test "$CROSS_PLATFORM_RESULT" = "success"
          test "$MAC_PREFLIGHT_RESULT" = "success"
          echo "All Windows, Linux, and macOS release gates passed; the single release writer is now unlocked."

  build-signed-mac-artifacts:
    name: Build signed Mac Actions artifacts
    needs: release-artifact-barrier
    runs-on: macos-15
    timeout-minutes: 120
    env:
      AGENTLAS_DESKTOP_GITHUB_REPO: agentlas-ai/agentlas-desktop-releases
      AGENTLAS_PUBLIC_RELEASE: "1"
      AGENTLAS_MAC_UPDATE_HISTORY_COUNT: "2"
      AGENTLAS_MAC_UPDATE_HISTORY_CACHE_DIR: ${{ github.workspace }}/.release-cache/agentlas-mac-update-history
      HEPHAESTUS_REF: v1.1.38
      HEPHAESTUS_COMMIT: 23f441d3f3ea8db126103475a5c4857148c8ce0b

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable Mac release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: |
            scripts/package-mac.sh
            scripts/verify-mac-update-lineage.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify and install immutable Mac release tooling
        run: |
          tooling_commit="$(git -C .release-tooling rev-parse HEAD)"
          if [ "$tooling_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Mac release tooling checkout does not match immutable workflow commit."
            exit 1
          fi
          cp .release-tooling/scripts/package-mac.sh scripts/package-mac.sh
          cp .release-tooling/scripts/verify-mac-update-lineage.mjs scripts/verify-mac-update-lineage.mjs
          chmod +x scripts/package-mac.sh scripts/verify-mac-update-lineage.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve release inputs after the all-OS barrier
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          RAW_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'false' }}
          RAW_APPLY_WEB_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_web_env || 'true' }}
        run: |
          tag="$RAW_TAG"
          version="${RAW_VERSION:-${tag#v}}"
          draft="$RAW_DRAFT"
          apply_web_env="$RAW_APPLY_WEB_ENV"
          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$tag" =~ $semver_tag_re ]] || [ "$version" != "${tag#v}" ]; then
            echo "::error::Release version/tag is not an exact stable SemVer pair."
            exit 1
          fi
          if [ "$draft" != "true" ] && [ "$draft" != "false" ]; then exit 1; fi
          if [ "$apply_web_env" != "true" ] && [ "$apply_web_env" != "false" ]; then exit 1; fi
          tagged_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          pkgver="$(node -p "require('./package.json').version")"
          lockver="$(node -p "require('./package-lock.json').version")"
          lockrootver="$(node -p "require('./package-lock.json').packages[''].version")"
          runtimever="$(node -p "require('./package.json').agentlasUpdateCompatibility.bundledRuntimeVersion")"
          runtimecommit="$(node -p "require('./package.json').agentlasBundledRuntimeSource.commit")"
          if [ "$head_commit" != "$tagged_commit" ] || [ "$pkgver" != "$version" ] || [ "$lockver" != "$version" ] || [ "$lockrootver" != "$version" ]; then
            echo "::error::Release source/tag/package identity mismatch."
            exit 1
          fi
          if [ "${HEPHAESTUS_REF#v}" != "$runtimever" ] || [ "$HEPHAESTUS_COMMIT" != "$runtimecommit" ]; then
            echo "::error::Bundled runtime source pin mismatch."
            exit 1
          fi
          {
            echo "RESOLVED_TAG=$tag"
            echo "RESOLVED_VERSION=$version"
            echo "RESOLVED_DRAFT=$draft"
            echo "RESOLVED_APPLY_WEB_ENV=$apply_web_env"
            echo "AGENTLAS_DESKTOP_RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"

      - name: Assert signing and release credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_DEVELOPER_ID_CERTIFICATE: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          GH_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$MAC_DEVELOPER_ID_CERTIFICATE"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$GH_TOKEN"

      - name: Ensure embedded engine and dependencies
        run: |
          npm run ensure:engine
          npm ci

      - name: Restore mac signing certificate
        env:
          MAC_DEVELOPER_ID_CERTIFICATE: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE }}
        run: |
          cert_path="$RUNNER_TEMP/agentlas-developer-id.p12"
          printf '%s' "$MAC_DEVELOPER_ID_CERTIFICATE" | base64 -D > "$cert_path"
          test -s "$cert_path"
          echo "CSC_LINK=$cert_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and verify Mac artifacts
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: npm run package:mac

      - name: Verify local signed-artifact update lineage
        env:
          GH_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
        run: >-
          npm run release:mac:lineage --
          --repo="$AGENTLAS_DESKTOP_GITHUB_REPO"
          --tag="$RESOLVED_TAG"
          --version="$RESOLVED_VERSION"
          --history-count=2
          --skip-remote-candidate

      - name: Upload signed Mac package set for the release barrier
        uses: actions/upload-artifact@v4
        with:
          name: agentlas-release-macOS
          path: |
            release/Agentlas-*.dmg
            release/Agentlas-*.dmg.blockmap
            release/Agentlas-*.zip
            release/Agentlas-*.zip.blockmap
            release/desktop-release-verification.json
            release/desktop-release.production.env
            release/latest-mac.yml
            release/update-lineage-verification.json
          if-no-files-found: error
          retention-days: 3

  publish-all-platforms:
    name: Single atomic public release writer
    needs:
      - release-artifact-barrier
      - build-signed-mac-artifacts
    runs-on: macos-15
    timeout-minutes: 45
    env:
      AGENTLAS_DESKTOP_GITHUB_REPO: agentlas-ai/agentlas-desktop-releases
      AGENTLAS_MAC_UPDATE_HISTORY_COUNT: "2"
      AGENTLAS_MAC_UPDATE_HISTORY_CACHE_DIR: ${{ github.workspace }}/.release-cache/agentlas-mac-update-history
      HEPHAESTUS_REF: v1.1.38
      HEPHAESTUS_COMMIT: 23f441d3f3ea8db126103475a5c4857148c8ce0b

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable Mac release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: |
            scripts/package-mac.sh
            scripts/verify-mac-update-lineage.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify and install immutable Mac release tooling
        run: |
          tooling_commit="$(git -C .release-tooling rev-parse HEAD)"
          if [ "$tooling_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Mac release tooling checkout does not match immutable workflow commit."
            exit 1
          fi
          cp .release-tooling/scripts/package-mac.sh scripts/package-mac.sh
          cp .release-tooling/scripts/verify-mac-update-lineage.mjs scripts/verify-mac-update-lineage.mjs
          chmod +x scripts/package-mac.sh scripts/verify-mac-update-lineage.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve atomic publish inputs
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          RAW_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'false' }}
          RAW_APPLY_WEB_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_web_env || 'true' }}
        run: |
          tag="$RAW_TAG"
          version="${RAW_VERSION:-${tag#v}}"
          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$tag" =~ $semver_tag_re ]] || [ "$version" != "${tag#v}" ]; then exit 1; fi
          if [ "$RAW_DRAFT" != "true" ] && [ "$RAW_DRAFT" != "false" ]; then exit 1; fi
          if [ "$RAW_APPLY_WEB_ENV" != "true" ] && [ "$RAW_APPLY_WEB_ENV" != "false" ]; then exit 1; fi
          tagged_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          pkgver="$(node -p "require('./package.json').version")"
          if [ "$head_commit" != "$tagged_commit" ] || [ "$pkgver" != "$version" ]; then exit 1; fi
          {
            echo "RESOLVED_TAG=$tag"
            echo "RESOLVED_VERSION=$version"
            echo "RESOLVED_DRAFT=$RAW_DRAFT"
            echo "RESOLVED_APPLY_WEB_ENV=$RAW_APPLY_WEB_ENV"
            echo "AGENTLAS_DESKTOP_RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"

      - name: Install publisher dependencies
        run: npm ci

      - name: Download every barrier-approved OS artifact
        uses: actions/download-artifact@v4
        with:
          pattern: agentlas-release-*
          path: release
          merge-multiple: true

      - name: Verify local required manifest and hashes before first public write
        run: >-
          npm run release:assets:verify --
          --release-dir=release
          --tag="$RESOLVED_TAG"
          --version="$RESOLVED_VERSION"

      - name: Single releases-repository writer and stable promotion
        env:
          GH_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
        run: |
          args=(--tag="$RESOLVED_TAG" --version="$RESOLVED_VERSION")
          if [ "$RESOLVED_DRAFT" = "true" ]; then args+=(--draft); fi
          npm run release:mac:publish -- "${args[@]}"

      - name: Install pinned Railway CLI for production release metadata
        if: env.RESOLVED_APPLY_WEB_ENV == 'true' && env.RESOLVED_DRAFT != 'true'
        run: npm install -g @railway/cli@5.26.0

      - name: Apply and verify production desktop release metadata
        if: env.RESOLVED_APPLY_WEB_ENV == 'true' && env.RESOLVED_DRAFT != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          test -n "$RAILWAY_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          npm run release:railway:check -- --project="$RAILWAY_PROJECT_ID" --environment=production --service=agentlas-web
          npm run release:web-env -- --apply --restart --environment=production --service=agentlas-web --verify-url=https://agentlas.cloud/api/desktop/latest

      - name: Upload complete release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentlas-desktop-release-evidence
          path: |
            release/desktop-release-verification.json
            release/desktop-release.production.env
            release/latest-mac.yml
            release/update-lineage-verification.json
            release/release-asset-manifest.json
          if-no-files-found: warn
