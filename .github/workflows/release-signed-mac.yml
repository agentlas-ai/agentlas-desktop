name: Release Signed macOS

# Production releases are deliberately manual. Creating a tag must not start a
# 50+ minute multi-platform release before the exact source and common CI are
# ready. Dispatch once with an explicit version/tag pair after those checks pass.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop package version to release"
        required: true
      tag:
        description: "GitHub release tag"
        required: true
      source_ref:
        description: "Exact immutable product source SHA; must match the release tag"
        required: true
        type: string
      mac_private_verification_ref:
        description: "Exact private Mac verification commit; verifier bytes remain private"
        required: true
        type: string
      mac_private_verification_manifest_sha256:
        description: "SHA-256 of the exact private Mac verification manifest"
        required: true
        type: string
      science_catalog_url:
        description: "Optional published Science candidate catalog URL; requires its SHA-256"
        required: false
        type: string
      science_catalog_sha256:
        description: "SHA-256 of the exact Science candidate catalog bytes"
        required: false
        type: string
      draft:
        description: "Create or keep the GitHub release as draft"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      apply_web_env:
        description: "Apply verified desktop release env vars to Railway production"
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-production-release
  cancel-in-progress: false

env:
  AGENTLAS_RELEASE_SOURCE_REF: ${{ inputs.source_ref || github.sha }}
  AGENTLAS_MAC_PRIVATE_VERIFICATION_REF: ${{ inputs.mac_private_verification_ref }}
  AGENTLAS_MAC_PRIVATE_VERIFICATION_MANIFEST_SHA256: ${{ inputs.mac_private_verification_manifest_sha256 }}

jobs:
  cross-platform-release-build:
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      source_ref: ${{ inputs.source_ref || github.sha }}
      harness_ref: ${{ github.sha }}
    secrets:
      AGENTLAS_DESKTOP_RELEASE_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}

  mac-release-preflight:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      AGENTLAS_SCIENCE_RELEASE_CATALOG_URL: ${{ inputs.science_catalog_url }}
      AGENTLAS_SCIENCE_RELEASE_CATALOG_SHA256: ${{ inputs.science_catalog_sha256 }}
      # Publish installers to the SEPARATE public releases repository.
      AGENTLAS_DESKTOP_GITHUB_REPO: agentlas-ai/agentlas-desktop-releases
      AGENTLAS_PUBLIC_RELEASE: "1"
      # Public verification keys only; private extension-signing keys never enter the app.
      # Keep the release-owned public key policy available to this caller job.
      # The reusable cross-platform workflow receives the repository variable,
      # but GitHub evaluates this caller's vars expression as empty.
      AGENTLAS_PRODUCT_EXTENSION_TRUSTED_KEYS_JSON: >-
        {"agentlas-product-extension-release-v1":"-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAhdzhuUqdSa8P+ydZZZ9pgrvoPDLZJq9mBohjEw9qa8g=\n-----END PUBLIC KEY-----"}
      AGENTLAS_MAC_UPDATE_HISTORY_COUNT: "2"
      AGENTLAS_MAC_UPDATE_REQUIRED_HISTORY_TAGS: "v0.8.58,v0.8.65"
      AGENTLAS_MAC_UPDATE_HISTORY_CACHE_DIR: ${{ github.workspace }}/.release-cache/agentlas-mac-update-history
      HEPHAESTUS_REF: v1.2.58
      HEPHAESTUS_COMMIT: 33c1e1fe1587aa2e5c9725745e312d5b88c26004
      HEPHAESTUS_ASSET_NAME: hephaestus-runtime-v1.2.58.tar.gz
      HEPHAESTUS_ASSET_SHA256: 49fda64fc20b0a3396b522c23f29a94bcf29f590cf8baaedab8e77d3d84f854a

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable Mac release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: .release-tooling
          sparse-checkout: |
            scripts/package-mac.sh
            scripts/verify-mac-update-lineage.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify and install immutable Mac release tooling
        run: |
          tooling_commit="$(git -C .release-tooling rev-parse HEAD)"
          if [ "$tooling_commit" != "$AGENTLAS_RELEASE_SOURCE_REF" ]; then
            echo "::error::Mac release tooling checkout does not match immutable product source commit."
            exit 1
          fi
          cp .release-tooling/scripts/package-mac.sh scripts/package-mac.sh
          cp .release-tooling/scripts/verify-mac-update-lineage.mjs scripts/verify-mac-update-lineage.mjs
          chmod +x scripts/package-mac.sh scripts/verify-mac-update-lineage.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve release inputs
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          RAW_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'false' }}
          RAW_APPLY_WEB_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_web_env || 'true' }}
        run: |
          tag="$RAW_TAG"
          version="${RAW_VERSION:-${tag#v}}"
          draft="$RAW_DRAFT"
          apply_web_env="$RAW_APPLY_WEB_ENV"
          if [ -z "$version" ] || [ -z "$tag" ]; then
            echo "::error::version/tag could not be resolved (tag=$tag, version=$version)"
            exit 1
          fi
          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$tag" =~ $semver_tag_re ]]; then
            echo "::error::Release tag must be stable SemVer with a leading v and no prerelease suffix (received: $tag)."
            exit 1
          fi
          if [ "$version" != "${tag#v}" ]; then
            echo "::error::Version $version does not match release tag $tag."
            exit 1
          fi
          if [ "$draft" != "true" ] && [ "$draft" != "false" ]; then
            echo "::error::draft must be true or false."
            exit 1
          fi
          if [ "$apply_web_env" != "true" ] && [ "$apply_web_env" != "false" ]; then
            echo "::error::apply_web_env must be true or false."
            exit 1
          fi
          if [ "$draft" = "false" ] && [ "$apply_web_env" != "true" ]; then
            echo "::error::A stable release must atomically update and verify the production web feed."
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          if [[ ! "$AGENTLAS_RELEASE_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Product source must be an exact immutable commit SHA."
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          if [ "$tag_commit" != "$AGENTLAS_RELEASE_SOURCE_REF" ]; then
            echo "::error::Product source must match the existing release tag; the harness cannot retag it."
            exit 1
          fi
          source_tree="$(git rev-parse HEAD^{tree})"
          if [ "$AGENTLAS_RELEASE_SOURCE_REF" = "160fb108705dcdf8251dd93ec5192ccf1d179b79" ] && [ "$source_tree" != "cc74a7a5ad66ddee20871b41272882b70e7466bb" ]; then
            echo "::error::Frozen Desktop 1.2.83 product tree changed."
            exit 1
          fi
          echo "::notice::Product source=$AGENTLAS_RELEASE_SOURCE_REF tree=$source_tree workflow=$GITHUB_SHA"
          if [ "$head_commit" != "$AGENTLAS_RELEASE_SOURCE_REF" ]; then
            echo "::error::Checked-out HEAD $head_commit does not match immutable product source $AGENTLAS_RELEASE_SOURCE_REF."
            exit 1
          fi
          pkgver=$(node -p "require('./package.json').version")
          lockver=$(node -p "require('./package-lock.json').version")
          lockrootver=$(node -p "require('./package-lock.json').packages[''].version")
          runtimever=$(node -p "require('./package.json').agentlasUpdateCompatibility.bundledRuntimeVersion")
          runtimecommit=$(node -p "require('./package.json').agentlasBundledRuntimeSource.commit")
          runtimeasset=$(node -p "require('./package.json').agentlasBundledRuntimeSource.assetName")
          runtimedigest=$(node -p "require('./package.json').agentlasBundledRuntimeSource.assetSha256")
          if [ "$pkgver" != "$version" ] || [ "$lockver" != "$version" ] || [ "$lockrootver" != "$version" ]; then
            echo "::error::Tag $tag requires package.json/package-lock root version=$version (got package=$pkgver lock=$lockver root=$lockrootver)."
            exit 1
          fi
          if [ "${HEPHAESTUS_REF#v}" != "$runtimever" ]; then
            echo "::error::HEPHAESTUS_REF=$HEPHAESTUS_REF does not match bundledRuntimeVersion=$runtimever."
            exit 1
          fi
          if [ "$HEPHAESTUS_COMMIT" != "$runtimecommit" ]; then
            echo "::error::HEPHAESTUS_COMMIT does not match package immutable runtime pin."
            exit 1
          fi
          if [ "$HEPHAESTUS_ASSET_NAME" != "$runtimeasset" ] || [ "$HEPHAESTUS_ASSET_SHA256" != "$runtimedigest" ]; then
            echo "::error::Agentlas OS release asset name/digest does not match package immutable runtime pin."
            exit 1
          fi
          {
            echo "RESOLVED_TAG=$tag"
            echo "RESOLVED_VERSION=$version"
            echo "RESOLVED_DRAFT=$draft"
            echo "RESOLVED_APPLY_WEB_ENV=$apply_web_env"
            echo "AGENTLAS_DESKTOP_RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"
          echo "::notice::Releasing tag=$tag version=$version draft=$draft apply_web_env=$apply_web_env"

      - name: Assert required release secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_DEVELOPER_ID_CERTIFICATE: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          GH_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          if [ "$APPLE_TEAM_ID" != "F469CGM7T5" ]; then
            echo "::error::APPLE_TEAM_ID must be the official Agentlas team F469CGM7T5."
            exit 1
          fi
          test -n "$MAC_DEVELOPER_ID_CERTIFICATE"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$GH_TOKEN"

      - name: Install pinned Railway CLI
        if: env.RESOLVED_APPLY_WEB_ENV == 'true'
        run: npm install -g @railway/cli@5.26.0

      - name: Check Railway release credentials
        if: env.RESOLVED_APPLY_WEB_ENV == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "::error::RAILWAY_TOKEN is required when apply_web_env=true."; exit 1; }
          test -n "$RAILWAY_PROJECT_ID" || { echo "::error::RAILWAY_PROJECT_ID is required when apply_web_env=true."; exit 1; }
          npm run release:railway:check -- --project="$RAILWAY_PROJECT_ID" --environment=production --service=agentlas-web
          echo "AGENTLAS_RAILWAY_RELEASE_READY=1" >> "$GITHUB_ENV"

      # Clone the git-ignored Hephaestus engine so the signed .app embeds it.
      - name: Ensure embedded engine (Hephaestus)
        run: npm run ensure:engine

      - name: Checkout pinned private release verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: agentlas-ai/agentlas-science
          ref: ${{ inputs.mac_private_verification_ref }}
          token: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
          path: .release-private-verification
          sparse-checkout: release-verification/desktop
          persist-credentials: false

      - name: Install hash-bound private verification files
        shell: bash
        run: |
          if [[ ! "$AGENTLAS_MAC_PRIVATE_VERIFICATION_REF" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$AGENTLAS_MAC_PRIVATE_VERIFICATION_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Private Mac verification requires an immutable commit and manifest digest."
            exit 1
          fi
          test "$(git -C .release-private-verification rev-parse HEAD)" = "$AGENTLAS_MAC_PRIVATE_VERIFICATION_REF"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const source = '.release-private-verification/release-verification/desktop';
          const cp = require('node:child_process');
          const manifestBytes = cp.execFileSync('git', ['-C', '.release-private-verification', 'show', `${process.env.AGENTLAS_MAC_PRIVATE_VERIFICATION_REF}:release-verification/desktop/manifest.json`]);
          const manifestDigest = crypto.createHash('sha256').update(manifestBytes).digest('hex');
          if (manifestDigest !== process.env.AGENTLAS_MAC_PRIVATE_VERIFICATION_MANIFEST_SHA256 || manifestDigest !== '896f8c8f526bf3ad490d86325eec92cb8ddb977b7f1cac11fe7b7eeea128610b') throw new Error('Private Mac verification manifest digest mismatch');
          const manifest = JSON.parse(manifestBytes);
          const approvedPins = new Map(Object.entries({
            "scripts/composer-event-sync-contract.mjs": "f13850e468e55431cb071b8f9ce83f707d5d00b05697e72bf9debdab00793857",
            "scripts/experience-promotion-contract.cjs": "bff44bfcb268e8d810b5932829867e2e31c1f687141e304c09a3aaf8c7fcb6da",
            "scripts/fixtures/ontology-chip-projection-v1.golden.json": "c68992fdf26305d3273bc1b4bead3b8df7aaa4149c67cb083f8ef4728ee783c1",
            "scripts/fixtures/portable-experience-bundle-v1-golden.json": "95af4082e530bf1503a95e09d4743a87a7a7129f9b6911da525263313270d3a6",
            "scripts/lib/agent-workspace-test-harness.cjs": "7ade73d07a3eace4f88fec27c10c8befc005cb8c3ab0e87b7423deeabafc4174",
            "scripts/lib/agent-workspace-ui-contract.cjs": "679265dbe07d0fc074ed8c6f12451650eef52adf63e04f74294c7f627323253d",
            "scripts/lib/one-live-contract-harness.cjs": "90e87e2ea931bf07eb3d1a28ba35484f79fa7a2091280d052c9fcd3006969db1",
            "scripts/lib/science-release-archive-validator.cjs": "34c4505e114a405c24dceeef1832afd084db00b9a8176bd397a8021b96520824",
            "scripts/lib/staged-gate-compile.cjs": "c4787def017bc136d7c5a6557a2773b26e6424f14e7c8133f202fd54098d863b",
            "scripts/loadout-editor-contract.cjs": "5ab36b40e0b644024061a8bdf22eb004d3163a13265c93b27a00e848fc916d66",
            "scripts/ontology-retirement-contract.mjs": "f4ac3666341407d9e6f90b48ece8841677e9cd93fe3257cf67732f2e51559d98",
            "scripts/plugin-spec-gate.cjs": "5b97156ee56144af0c5ec39f867607e23a3c72841e14d6cd889a1901a094878f",
            "scripts/qa-language-switch.cjs": "7d5803d0a1e1476725f9cfa27f3ee9a0533a0b34866bd2ea482bf9b36a17528a",
            "scripts/qa-science-dinosaur-prompt-chain-electron.cjs": "3538a22edf65b568f84e79f573eefb93c1e7495f0ae6c8caca82d5cee5e123ec",
            "scripts/result-artifact-route-contract.mjs": "541910e7ac2301e0cfa45f04725c0000fde2d567560e294c441c74e67b546983",
            "scripts/run-bound-gates.mjs": "7bcdfe75c49cbc029fbf5a14c91a8eab257eb434fc6e026d9f57ecabde66d332",
            "scripts/science-release-catalog-archive-gate.mjs": "8d5077b72a6037b7bfff390a3d25d3c793def9ad57ff5aa2dab8f9099855c90c",
            "scripts/table-payload-dialects-contract.mjs": "9c54c666e7306e4580481d446ff15cec18a59bd6e1c4af60f85265e746baf722",
            "scripts/test-agent-evolution-trust.cjs": "918e22c1945b8764daabaea8253a6667dd07685f064e64665765f9608be90b6e",
            "scripts/test-agent-hub-ontology-projection.cjs": "1db544bdb4963450cf2f743a59eb08757902c32cb9406926af71c4cfbfcc9931",
            "scripts/test-agent-toolbox-contract.cjs": "6f79dc0532ae473a4a03fe98d80aa6f1dab2d70a77d1dfc9058fa400a49638a4",
            "scripts/test-automation-honesty-contract.cjs": "7e1d1144e01c01b436da8a12edc2554dfc228e2b0e16648f838dd55ef7501c35",
            "scripts/test-build-session-contracts.cjs": "62b4b62a609647d43864e3b32d51cef0c7d1414711aacb941a6c021a43c146c8",
            "scripts/test-chat-ux-contracts.cjs": "adcfbd5dc0214ec62bda5bd420586a30cd2f412a39b51c9d6b7c3c2818e5c55b",
            "scripts/test-experience-i18n-contract.cjs": "b25f1d7740febc868cace13690e358e0e08ac764dddc325e27294827d0d32398",
            "scripts/test-experience-p0.cjs": "982c55992152be652eadec6b8a4433708814c40d1cefbd2fbf2b74e38b3e0c4d",
            "scripts/test-first-run-roles-from-onboarding.cjs": "a482380530cca91ff82807844cf04878e9d08c847ef9a4106c12abab0b696317",
            "scripts/test-hub-bookmark-ux.cjs": "782386b1d2687fdd5e90f64bf239009410f55d0f419bac7d0d5482274bf22121",
            "scripts/test-mobile-ontology-bridge.cjs": "5257bdc12ab680997da410f7c2e03293224b00d139a817c6bd42109c9a54bf37",
            "scripts/test-one-activity-contract.cjs": "5db013479e70a055a3b592377a838ce50592526a842ec9643b4ff5e62afd3ce8",
            "scripts/test-one-sidebar-contract.cjs": "2034e1403bcac447df68cf4cc4c2261a1612fe25fb3f34afb0d5018206021bfe",
            "scripts/test-project-first-v84.cjs": "358b7ee974985aef2d2d4eeaec53fc1a91f51b81032fa9760f317fa7e4f16a16",
            "scripts/test-room-isolation-and-owner-turn.cjs": "8d35fdd605c9c5d5441d33abe9ba1c277f2d770da3515839d909c9acf90aff29",
            "scripts/test-system-agent-taste-runtime.cjs": "be6a377c460d29adeb2bb5198ad5727cbbf42f5f3e54aac6864217adb374a3e3",
            "scripts/test-taste-chip-workflow.cjs": "d0f83459c5f4d34f9d969451d2217e6eb8cd465b7bc9d6cd943e5ce5c9ccd19e",
            "scripts/test-taste-runtime-application.cjs": "d8f0fbef5b47d44b7504b8c6eb10231d5edfc3bee094657f53433f951abcb667",
            "scripts/test-terminal-ontology-loadout-feed.cjs": "c157aab78946ae9ef98f6b9af04fe207919dcf7a18e21cc664ee32bb65420e46",
            "scripts/test-toolchain-apps.cjs": "ab8c4009fd12ee9efccbbc85487bb98ef0836469402147581bf0c06be1503574",
            "scripts/verify-agentlas-one-ui.cjs": "8087486beaffbb0cc825f637af4926ec55527941adf6e76992dfa25db996f2fe",
            "scripts/verify-build-recovery.mjs": "aa62f09ba3511d75762393cb747bf6654ef666c91b0cb90ef6bde61ed037f7fe",
            "scripts/verify-builtin-plugins-degrade.mjs": "47801c16ef3dd39c0da35d56103f8ba3eca3d179f4ce5ca8b73a8f556324eaaf",
            "scripts/verify-one-composer-surface.mjs": "4dc0eec040819d5db15d1e0e48ee866a139e33d8f3ff525cb25b3c75e5445f08",
            "scripts/verify-one-team-permission-boundary.mjs": "f2373e909cd59c6957d6014fe6ab6f3e0a924b13b335f1d06ff8beaef353a126",
            "scripts/verify-one-team-surface.mjs": "a799e9842b1a404937ce9494fe543de2dec7510a9ee8026ad5cdf883bcdc50a1",
            "scripts/current-sidebar-route-contract.cjs": "46d8f58f57e0a7a93cbde54582387d4f937e9f2bf07cd50956eb6520eb004f37"
          }));
          if (manifest.files?.length !== 45 || approvedPins.size !== 45) throw new Error('All 44 original private Mac entries plus the exact sealed R7 sidebar helper are required');
          if (manifest.schema !== 'agentlas.private-release-verification.v1' || !Array.isArray(manifest.files)) throw new Error('Invalid private verification manifest');
          const seen = new Set();
          const sourceCommit = require('node:child_process').execFileSync('git', ['rev-parse', '--verify', 'HEAD^{commit}']).toString().trim();
          const sourcePaths = new Set(require('node:child_process').execFileSync('git', ['ls-tree', '-r', '--name-only', '-z', sourceCommit]).toString().split('\0'));
          for (const entry of manifest.files) {
            if (!/^scripts\/(?:[A-Za-z0-9_-]+\/)*[A-Za-z0-9_.-]+$/.test(entry.path) || entry.path.includes('..') || seen.has(entry.path)) throw new Error('Invalid verification path');
            seen.add(entry.path);
            if (!approvedPins.has(entry.path) || entry.sha256 !== approvedPins.get(entry.path)) throw new Error('Private Mac verification filename or approved digest changed');
            const bytes = require('node:child_process').execFileSync('git', ['-C', '.release-private-verification', 'show', `${process.env.AGENTLAS_MAC_PRIVATE_VERIFICATION_REF}:release-verification/desktop/${entry.path}`]);
            if (crypto.createHash('sha256').update(bytes).digest('hex') !== entry.sha256) throw new Error('Verification file digest mismatch');
            if (sourcePaths.has(entry.path)) {
              if (!fs.existsSync(entry.path) || !fs.lstatSync(entry.path).isFile()) throw new Error('Committed runtime file is missing from the release source');
              const committed = require('node:child_process').execFileSync('git', ['show', `${sourceCommit}:${entry.path}`]);
              if (!fs.readFileSync(entry.path).equals(committed)) throw new Error('Committed runtime file differs from the release source');
              continue;
            }
            if (fs.existsSync(entry.path)) throw new Error('Private verification target is untracked and already exists');
            fs.mkdirSync(path.dirname(entry.path), { recursive: true });
            fs.writeFileSync(entry.path, bytes);
          }
          console.log(`Installed ${seen.size} private verification files from the pinned release`);
          NODE

      - name: Install dependencies
        shell: bash
        env:
          AGENTLAS_SCIENCE_GITHUB_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
        run: |
          git_config="$RUNNER_TEMP/agentlas-science-gitconfig"
          trap 'rm -f "$git_config"' EXIT
          test -n "$AGENTLAS_SCIENCE_GITHUB_TOKEN"
          umask 077
          cat > "$git_config" <<EOF
          [url "https://x-access-token:${AGENTLAS_SCIENCE_GITHUB_TOKEN}@github.com/agentlas-ai/agentlas-science.git"]
              insteadOf = ssh://git@github.com/agentlas-ai/agentlas-science.git
              insteadOf = git+ssh://git@github.com/agentlas-ai/agentlas-science.git
              insteadOf = git@github.com:agentlas-ai/agentlas-science.git
          EOF
          GIT_CONFIG_GLOBAL="$git_config" npm ci --no-audit

      # Verify that the release tag, pinned Core, schema version, README, and
      # CHANGELOG agree before building and signing the production sources.
      - name: Verify deterministic release contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run release:preflight
          npm run build:electron

      - name: Build production updater surfaces and reject forced reinstall copy
        run: |
          npm run build:renderer
          node <<'NODE'
          const fs = require('node:fs');
          const { TextDecoder } = require('node:util');
          const paths = [
            'renderer/components/UpdateBanner.tsx',
            'renderer/components/VersionChip.tsx',
            'renderer/app/(shell)/settings/page.tsx',
          ];
          const forbidden = /홈페이지|다시 설치|재설치|website|reinstall|re-download|redownload|공식 설치/iu;
          const decoder = new TextDecoder('utf-8', { fatal: true });
          let rejected = false;
          for (const file of paths) {
            let text;
            try { text = decoder.decode(fs.readFileSync(file)); }
            catch {
              console.error(`::error::Updater source copy guard could not read a UTF-8 source file: ${file}`);
              process.exit(2);
            }
            if (forbidden.test(text)) {
              console.error(`::error::Updater surfaces must recover in app and must not force a website reinstall: ${file}`);
              rejected = true;
            }
          }
          if (rejected) process.exit(1);
          console.log(`Updater source copy guard checked ${paths.length} UTF-8 files.`);
          NODE

      - name: Prepare pinned browser runtime for private contracts
        run: npm run fetch:browser

      - name: Verify committed private Workspace and owner contracts
        timeout-minutes: 60
        shell: bash
        run: |
          node <<'NODE'
          const cp = require('node:child_process');
          if (Number(process.versions.node.split('.')[0]) !== 22) throw new Error('Node22 required');
          const gates = [
            {
              "path": "scripts/experience-promotion-contract.cjs",
              "main": false
            },
            {
