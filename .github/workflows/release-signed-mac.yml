          if [[ ! "$AGENTLAS_MAC_PRIVATE_VERIFICATION_REF" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$AGENTLAS_MAC_PRIVATE_VERIFICATION_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
