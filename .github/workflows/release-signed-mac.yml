name: Release Signed macOS

# Production releases are deliberately manual. Creating a tag must not start a
# 50+ minute multi-platform release before the exact source and common CI are
# ready. Dispatch once with an explicit version/tag pair after those checks pass.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop package version to release"
        required: true
      tag:
        description: "GitHub release tag"
        required: true
      science_catalog_url:
        description: "Optional published Science candidate catalog URL; requires its SHA-256"
        required: false
        type: string
      science_catalog_sha256:
        description: "SHA-256 of the exact Science candidate catalog bytes"
        required: false
        type: string
      draft:
        description: "Create or keep the GitHub release as draft"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      apply_web_env:
        description: "Apply verified desktop release env vars to Railway production"
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-production-release
  cancel-in-progress: false

jobs:
  cross-platform-release-build:
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      source_ref: ${{ github.sha }}
      harness_ref: ${{ github.sha }}

  mac-release-preflight:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      AGENTLAS_SCIENCE_RELEASE_CATALOG_URL: ${{ inputs.science_catalog_url }}
      AGENTLAS_SCIENCE_RELEASE_CATALOG_SHA256: ${{ inputs.science_catalog_sha256 }}
      # Publish installers to the SEPARATE public releases repository.
      AGENTLAS_DESKTOP_GITHUB_REPO: agentlas-ai/agentlas-desktop-releases
      AGENTLAS_PUBLIC_RELEASE: "1"
      # Public verification keys only; private extension-signing keys never enter the app.
      # Keep the release-owned public key policy available to this caller job.
      # The reusable cross-platform workflow receives the repository variable,
      # but GitHub evaluates this caller's vars expression as empty.
      AGENTLAS_PRODUCT_EXTENSION_TRUSTED_KEYS_JSON: >-
        {"agentlas-product-extension-release-v1":"-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAhdzhuUqdSa8P+ydZZZ9pgrvoPDLZJq9mBohjEw9qa8g=\n-----END PUBLIC KEY-----"}
      AGENTLAS_MAC_UPDATE_HISTORY_COUNT: "2"
      AGENTLAS_MAC_UPDATE_REQUIRED_HISTORY_TAGS: "v0.8.58,v0.8.65"
      AGENTLAS_MAC_UPDATE_HISTORY_CACHE_DIR: ${{ github.workspace }}/.release-cache/agentlas-mac-update-history
      HEPHAESTUS_REF: v1.2.44
      HEPHAESTUS_COMMIT: 1f6d64374502cfd5f8581ad3c1fb18691ed61b1d
      HEPHAESTUS_ASSET_NAME: hephaestus-runtime-v1.2.44.tar.gz
      HEPHAESTUS_ASSET_SHA256: 795d1c294db662475d4eb0c7e4562ba0ca1e0f27d3b1da0f5e9c6e7cf627d83a

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable Mac release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: |
            scripts/package-mac.sh
            scripts/verify-mac-update-lineage.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify and install immutable Mac release tooling
        run: |
          tooling_commit="$(git -C .release-tooling rev-parse HEAD)"
          if [ "$tooling_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Mac release tooling checkout does not match immutable workflow commit."
            exit 1
          fi
          cp .release-tooling/scripts/package-mac.sh scripts/package-mac.sh
          cp .release-tooling/scripts/verify-mac-update-lineage.mjs scripts/verify-mac-update-lineage.mjs
          chmod +x scripts/package-mac.sh scripts/verify-mac-update-lineage.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve release inputs
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          RAW_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'false' }}
          RAW_APPLY_WEB_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_web_env || 'true' }}
        run: |
          tag="$RAW_TAG"
          version="${RAW_VERSION:-${tag#v}}"
          draft="$RAW_DRAFT"
          apply_web_env="$RAW_APPLY_WEB_ENV"
          if [ -z "$version" ] || [ -z "$tag" ]; then
            echo "::error::version/tag could not be resolved (tag=$tag, version=$version)"
            exit 1
          fi
          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$tag" =~ $semver_tag_re ]]; then
            echo "::error::Release tag must be stable SemVer with a leading v and no prerelease suffix (received: $tag)."
            exit 1
          fi
          if [ "$version" != "${tag#v}" ]; then
            echo "::error::Version $version does not match release tag $tag."
            exit 1
          fi
          if [ "$draft" != "true" ] && [ "$draft" != "false" ]; then
            echo "::error::draft must be true or false."
            exit 1
          fi
          if [ "$apply_web_env" != "true" ] && [ "$apply_web_env" != "false" ]; then
            echo "::error::apply_web_env must be true or false."
            exit 1
          fi
          if [ "$draft" = "false" ] && [ "$apply_web_env" != "true" ]; then
            echo "::error::A stable release must atomically update and verify the production web feed."
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Checked-out HEAD $head_commit does not match immutable workflow source $GITHUB_SHA."
            exit 1
          fi
          pkgver=$(node -p "require('./package.json').version")
          lockver=$(node -p "require('./package-lock.json').version")
          lockrootver=$(node -p "require('./package-lock.json').packages[''].version")
          runtimever=$(node -p "require('./package.json').agentlasUpdateCompatibility.bundledRuntimeVersion")
          runtimecommit=$(node -p "require('./package.json').agentlasBundledRuntimeSource.commit")
          runtimeasset=$(node -p "require('./package.json').agentlasBundledRuntimeSource.assetName")
          runtimedigest=$(node -p "require('./package.json').agentlasBundledRuntimeSource.assetSha256")
          if [ "$pkgver" != "$version" ] || [ "$lockver" != "$version" ] || [ "$lockrootver" != "$version" ]; then
            echo "::error::Tag $tag requires package.json/package-lock root version=$version (got package=$pkgver lock=$lockver root=$lockrootver)."
            exit 1
          fi
          if [ "${HEPHAESTUS_REF#v}" != "$runtimever" ]; then
            echo "::error::HEPHAESTUS_REF=$HEPHAESTUS_REF does not match bundledRuntimeVersion=$runtimever."
            exit 1
          fi
          if [ "$HEPHAESTUS_COMMIT" != "$runtimecommit" ]; then
            echo "::error::HEPHAESTUS_COMMIT does not match package immutable runtime pin."
            exit 1
          fi
          if [ "$HEPHAESTUS_ASSET_NAME" != "$runtimeasset" ] || [ "$HEPHAESTUS_ASSET_SHA256" != "$runtimedigest" ]; then
            echo "::error::Agentlas OS release asset name/digest does not match package immutable runtime pin."
            exit 1
          fi
          {
            echo "RESOLVED_TAG=$tag"
            echo "RESOLVED_VERSION=$version"
            echo "RESOLVED_DRAFT=$draft"
            echo "RESOLVED_APPLY_WEB_ENV=$apply_web_env"
            echo "AGENTLAS_DESKTOP_RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"
          echo "::notice::Releasing tag=$tag version=$version draft=$draft apply_web_env=$apply_web_env"

      - name: Assert required release secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_DEVELOPER_ID_CERTIFICATE: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          GH_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          if [ "$APPLE_TEAM_ID" != "F469CGM7T5" ]; then
            echo "::error::APPLE_TEAM_ID must be the official Agentlas team F469CGM7T5."
            exit 1
          fi
          test -n "$MAC_DEVELOPER_ID_CERTIFICATE"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$GH_TOKEN"

      - name: Install pinned Railway CLI
        if: env.RESOLVED_APPLY_WEB_ENV == 'true'
        run: npm install -g @railway/cli@5.26.0

      - name: Check Railway release credentials
        if: env.RESOLVED_APPLY_WEB_ENV == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "::error::RAILWAY_TOKEN is required when apply_web_env=true."; exit 1; }
          test -n "$RAILWAY_PROJECT_ID" || { echo "::error::RAILWAY_PROJECT_ID is required when apply_web_env=true."; exit 1; }
          npm run release:railway:check -- --project="$RAILWAY_PROJECT_ID" --environment=production --service=agentlas-web
          echo "AGENTLAS_RAILWAY_RELEASE_READY=1" >> "$GITHUB_ENV"

      # Clone the git-ignored Hephaestus engine so the signed .app embeds it.
      - name: Ensure embedded engine (Hephaestus)
        run: npm run ensure:engine

      - name: Install dependencies
        run: npm ci --no-audit

      # Private/local release audits own UI fixtures and native updater mutation
      # scenarios. Public CI builds the exact production sources and enforces
      # the end-user no-reinstall boundary without publishing those fixtures.
      # Suites do not run here any more (owner decision, 2026-07-26): CI builds,
      # signs, and publishes. release:preflight stays because it is not a suite —
      # it proves this tag's pinned Core, schema version, README, and CHANGELOG
      # agree, which is what makes the artifact a valid release at all.
      - name: Verify deterministic release contracts
        run: |
          npm run release:preflight
          npm run build:electron

      - name: Build production updater surfaces and reject forced reinstall copy
        run: |
          npm run build:renderer
          if rg -n -i '홈페이지|다시 설치|재설치|website|reinstall|re-download|redownload|공식 설치' \
            renderer/components/UpdateBanner.tsx \
            renderer/components/VersionChip.tsx \
            'renderer/app/(shell)/settings/page.tsx'; then
            echo "::error::Updater surfaces must recover in app and must not force a website reinstall."
            exit 1
          fi

      - name: Record successful macOS release preflight
        run: echo "macOS release tests completed without publishing any release assets"

  release-artifact-barrier:
    name: All OS release gate barrier
    if: ${{ always() }}
    needs:
      - cross-platform-release-build
      - mac-release-preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Require every OS gate and package job
        env:
          CROSS_PLATFORM_RESULT: ${{ needs.cross-platform-release-build.result }}
          MAC_PREFLIGHT_RESULT: ${{ needs.mac-release-preflight.result }}
        run: |
          test "$CROSS_PLATFORM_RESULT" = "success"
          test "$MAC_PREFLIGHT_RESULT" = "success"
          echo "All Windows, Linux, and macOS release gates passed; the single release writer is now unlocked."

  build-signed-mac-artifacts:
    name: Build signed Mac Actions artifacts
    needs: release-artifact-barrier
    runs-on: macos-15
    timeout-minutes: 120
    env:
      AGENTLAS_DESKTOP_GITHUB_REPO: agentlas-ai/agentlas-desktop-releases
      AGENTLAS_PUBLIC_RELEASE: "1"
      # Public verification keys only. Keep the actual signing job fail-closed
      # while making the release-owned policy available on the macOS runner.
      AGENTLAS_PRODUCT_EXTENSION_TRUSTED_KEYS_JSON: >-
        {"agentlas-product-extension-release-v1":"-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAhdzhuUqdSa8P+ydZZZ9pgrvoPDLZJq9mBohjEw9qa8g=\n-----END PUBLIC KEY-----"}
      AGENTLAS_MAC_UPDATE_HISTORY_COUNT: "2"
      AGENTLAS_MAC_UPDATE_REQUIRED_HISTORY_TAGS: "v0.8.58,v0.8.65"
      AGENTLAS_MAC_UPDATE_HISTORY_CACHE_DIR: ${{ github.workspace }}/.release-cache/agentlas-mac-update-history
      HEPHAESTUS_REF: v1.2.44
      HEPHAESTUS_COMMIT: 1f6d64374502cfd5f8581ad3c1fb18691ed61b1d
      HEPHAESTUS_ASSET_NAME: hephaestus-runtime-v1.2.44.tar.gz
      HEPHAESTUS_ASSET_SHA256: 795d1c294db662475d4eb0c7e4562ba0ca1e0f27d3b1da0f5e9c6e7cf627d83a

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable Mac release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: |
            scripts/package-mac.sh
            scripts/verify-mac-update-lineage.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify and install immutable Mac release tooling
        run: |
          tooling_commit="$(git -C .release-tooling rev-parse HEAD)"
          if [ "$tooling_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Mac release tooling checkout does not match immutable workflow commit."
            exit 1
          fi
          cp .release-tooling/scripts/package-mac.sh scripts/package-mac.sh
          cp .release-tooling/scripts/verify-mac-update-lineage.mjs scripts/verify-mac-update-lineage.mjs
          chmod +x scripts/package-mac.sh scripts/verify-mac-update-lineage.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve release inputs after the all-OS barrier
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          RAW_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'false' }}
          RAW_APPLY_WEB_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_web_env || 'true' }}
        run: |
          tag="$RAW_TAG"
          version="${RAW_VERSION:-${tag#v}}"
          draft="$RAW_DRAFT"
          apply_web_env="$RAW_APPLY_WEB_ENV"
          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$tag" =~ $semver_tag_re ]] || [ "$version" != "${tag#v}" ]; then
            echo "::error::Release version/tag is not an exact stable SemVer pair."
            exit 1
          fi
          if [ "$draft" != "true" ] && [ "$draft" != "false" ]; then exit 1; fi
          if [ "$apply_web_env" != "true" ] && [ "$apply_web_env" != "false" ]; then exit 1; fi
          head_commit="$(git rev-parse HEAD)"
          pkgver="$(node -p "require('./package.json').version")"
          lockver="$(node -p "require('./package-lock.json').version")"
          lockrootver="$(node -p "require('./package-lock.json').packages[''].version")"
          runtimever="$(node -p "require('./package.json').agentlasUpdateCompatibility.bundledRuntimeVersion")"
          runtimecommit="$(node -p "require('./package.json').agentlasBundledRuntimeSource.commit")"
          runtimeasset="$(node -p "require('./package.json').agentlasBundledRuntimeSource.assetName")"
          runtimedigest="$(node -p "require('./package.json').agentlasBundledRuntimeSource.assetSha256")"
          if [ "$head_commit" != "$GITHUB_SHA" ] || [ "$pkgver" != "$version" ] || [ "$lockver" != "$version" ] || [ "$lockrootver" != "$version" ]; then
            echo "::error::Release source commit/package identity mismatch."
            exit 1
          fi
          if [ "${HEPHAESTUS_REF#v}" != "$runtimever" ] || [ "$HEPHAESTUS_COMMIT" != "$runtimecommit" ]; then
            echo "::error::Bundled runtime source pin mismatch."
            exit 1
          fi
          if [ "$HEPHAESTUS_ASSET_NAME" != "$runtimeasset" ] || [ "$HEPHAESTUS_ASSET_SHA256" != "$runtimedigest" ]; then
            echo "::error::Bundled runtime release asset pin mismatch."
            exit 1
          fi
          {
            echo "RESOLVED_TAG=$tag"
            echo "RESOLVED_VERSION=$version"
            echo "RESOLVED_DRAFT=$draft"
            echo "RESOLVED_APPLY_WEB_ENV=$apply_web_env"
            echo "AGENTLAS_DESKTOP_RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"

      - name: Assert signing and release credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_DEVELOPER_ID_CERTIFICATE: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          GH_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          if [ "$APPLE_TEAM_ID" != "F469CGM7T5" ]; then
            echo "::error::APPLE_TEAM_ID must be the official Agentlas team F469CGM7T5."
            exit 1
          fi
          test -n "$MAC_DEVELOPER_ID_CERTIFICATE"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$GH_TOKEN"

      - name: Ensure embedded engine and dependencies
        run: |
          npm run ensure:engine
          npm ci --no-audit

      - name: Restore mac signing certificate
        env:
          MAC_DEVELOPER_ID_CERTIFICATE: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE }}
        run: |
          cert_path="$RUNNER_TEMP/agentlas-developer-id.p12"
          printf '%s' "$MAC_DEVELOPER_ID_CERTIFICATE" | base64 -D > "$cert_path"
          test -s "$cert_path"
          echo "CSC_LINK=$cert_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and verify Mac artifacts
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: npm run package:mac

      - name: Verify local signed-artifact update lineage
        env:
          GH_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
        run: >-
          npm run release:mac:lineage --
          --repo="$AGENTLAS_DESKTOP_GITHUB_REPO"
          --tag="$RESOLVED_TAG"
          --version="$RESOLVED_VERSION"
          --history-count=2
          --skip-remote-candidate

      - name: Upload signed Mac package set for the release barrier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentlas-release-macOS
          path: |
            release/Agentlas-*.dmg
            release/Agentlas-*.dmg.blockmap
            release/Agentlas-*.zip
            release/Agentlas-*.zip.blockmap
            release/desktop-release-verification.json
            release/latest-mac.yml
            release/update-lineage-verification.json
          if-no-files-found: error
          retention-days: 3

  publish-all-platforms:
    name: Single atomic public release writer
    needs:
      - release-artifact-barrier
      - build-signed-mac-artifacts
    runs-on: macos-15
    timeout-minutes: 45
    env:
      AGENTLAS_DESKTOP_GITHUB_REPO: agentlas-ai/agentlas-desktop-releases
      AGENTLAS_MAC_UPDATE_HISTORY_COUNT: "2"
      AGENTLAS_MAC_UPDATE_REQUIRED_HISTORY_TAGS: "v0.8.58,v0.8.65"
      AGENTLAS_MAC_UPDATE_HISTORY_CACHE_DIR: ${{ github.workspace }}/.release-cache/agentlas-mac-update-history
      HEPHAESTUS_REF: v1.2.44
      HEPHAESTUS_COMMIT: 1f6d64374502cfd5f8581ad3c1fb18691ed61b1d
      HEPHAESTUS_ASSET_NAME: hephaestus-runtime-v1.2.44.tar.gz
      HEPHAESTUS_ASSET_SHA256: 795d1c294db662475d4eb0c7e4562ba0ca1e0f27d3b1da0f5e9c6e7cf627d83a

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable Mac release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: |
            scripts/package-mac.sh
            scripts/verify-mac-update-lineage.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify and install immutable Mac release tooling
        run: |
          tooling_commit="$(git -C .release-tooling rev-parse HEAD)"
          if [ "$tooling_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Mac release tooling checkout does not match immutable workflow commit."
            exit 1
          fi
          cp .release-tooling/scripts/package-mac.sh scripts/package-mac.sh
          cp .release-tooling/scripts/verify-mac-update-lineage.mjs scripts/verify-mac-update-lineage.mjs
          chmod +x scripts/package-mac.sh scripts/verify-mac-update-lineage.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve atomic publish inputs
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          RAW_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'false' }}
          RAW_APPLY_WEB_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_web_env || 'true' }}
        run: |
          tag="$RAW_TAG"
          version="${RAW_VERSION:-${tag#v}}"
          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$tag" =~ $semver_tag_re ]] || [ "$version" != "${tag#v}" ]; then exit 1; fi
          if [ "$RAW_DRAFT" != "true" ] && [ "$RAW_DRAFT" != "false" ]; then exit 1; fi
          if [ "$RAW_APPLY_WEB_ENV" != "true" ] && [ "$RAW_APPLY_WEB_ENV" != "false" ]; then exit 1; fi
          if [ "$RAW_DRAFT" = "false" ] && [ "$RAW_APPLY_WEB_ENV" != "true" ]; then
            echo "::error::A stable release must atomically update and verify the production web feed."
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          pkgver="$(node -p "require('./package.json').version")"
          if [ "$head_commit" != "$GITHUB_SHA" ] || [ "$pkgver" != "$version" ]; then exit 1; fi
          {
            echo "RESOLVED_TAG=$tag"
            echo "RESOLVED_VERSION=$version"
            echo "RESOLVED_DRAFT=$RAW_DRAFT"
            echo "RESOLVED_APPLY_WEB_ENV=$RAW_APPLY_WEB_ENV"
            echo "AGENTLAS_DESKTOP_RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"

      - name: Install publisher dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Download every barrier-approved OS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agentlas-release-*
          path: release
          merge-multiple: true

      - name: Verify local required manifest and hashes before first public write
        run: >-
          npm run release:assets:verify --
          --release-dir=release
          --tag="$RESOLVED_TAG"
          --version="$RESOLVED_VERSION"
          --public-allowlist
          --build-outputs-only

      - name: Install pinned Railway CLI before stable publication
        if: env.RESOLVED_DRAFT != 'true'
        run: npm install -g @railway/cli@5.26.0

      - name: Gate stable writer on exact production Railway access
        if: env.RESOLVED_DRAFT != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          test -n "$RAILWAY_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          npm run release:railway:check -- --project="$RAILWAY_PROJECT_ID" --environment=production --service=agentlas-web
          echo "AGENTLAS_RAILWAY_RELEASE_READY=1" >> "$GITHUB_ENV"
          echo "AGENTLAS_RAILWAY_PROJECT_VERIFIED=$RAILWAY_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Single releases-repository writer and stable promotion
        env:
          GH_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
        run: |
          args=(--tag="$RESOLVED_TAG" --version="$RESOLVED_VERSION")
          if [ "$RESOLVED_DRAFT" = "true" ]; then args+=(--draft); fi
          npm run release:mac:publish -- "${args[@]}"

      - name: Apply and verify production desktop release metadata
        if: env.RESOLVED_APPLY_WEB_ENV == 'true' && env.RESOLVED_DRAFT != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          test -n "$RAILWAY_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          npm run release:railway:check -- --project="$RAILWAY_PROJECT_ID" --environment=production --service=agentlas-web
          npm run release:web-env -- --apply --redeploy --verification-file=release/desktop-release-verification.json --expected-version="$RESOLVED_VERSION" --expected-tag="$RESOLVED_TAG" --environment=production --service=agentlas-web --verify-url=https://agentlas.cloud/api/desktop/latest

      - name: Upload complete release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentlas-desktop-release-evidence
          path: |
            release/desktop-release-verification.json
            release/latest-mac.yml
            release/update-lineage-verification.json
            release/release-asset-manifest.json
          if-no-files-found: warn
