name: Release Signed macOS

# Two ways to trigger:
#   1. Push a tag matching v*.*.*  -> automatic signed macOS release
#   2. Manual via GitHub UI / `gh workflow run` with explicit version/tag
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop package version to release"
        required: true
        default: "0.2.19"
      tag:
        description: "GitHub release tag"
        required: true
        default: "v0.2.19"
      draft:
        description: "Create or keep the GitHub release as draft"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      apply_web_env:
        description: "Apply verified desktop release env vars to Railway production"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  actions: read

jobs:
  build-notarize-publish:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Publish to the SEPARATE public releases repo (source repo is private).
      AGENTLAS_DESKTOP_GITHUB_REPO: agentlas-ai/agentlas-desktop-releases
      AGENTLAS_PUBLIC_RELEASE: "1"
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MAC_DEVELOPER_ID_CERTIFICATE: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      GH_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      HEPHAESTUS_REF: v1.1.12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve release inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            version="${{ inputs.version }}"
            draft="${{ inputs.draft }}"
            apply_web_env="${{ inputs.apply_web_env }}"
          else
            tag="${{ github.ref_name }}"
            version="${tag#v}"
            draft="false"
            apply_web_env="true"
          fi
          if [ -z "$version" ] || [ -z "$tag" ]; then
            echo "::error::version/tag could not be resolved (tag=$tag, version=$version)"
            exit 1
          fi
          pkgver=$(node -p "require('./package.json').version")
          if [ "$pkgver" != "$version" ]; then
            echo "::error::Tag $tag implies version=$version but package.json is $pkgver. Bump package.json before tagging."
            exit 1
          fi
          {
            echo "RESOLVED_TAG=$tag"
            echo "RESOLVED_VERSION=$version"
            echo "RESOLVED_DRAFT=$draft"
            echo "RESOLVED_APPLY_WEB_ENV=$apply_web_env"
            echo "AGENTLAS_DESKTOP_RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"
          echo "::notice::Releasing tag=$tag version=$version draft=$draft apply_web_env=$apply_web_env"

      - name: Assert required release secrets
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$MAC_DEVELOPER_ID_CERTIFICATE"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$GH_TOKEN"

      - name: Check Railway release credentials
        if: env.RESOLVED_APPLY_WEB_ENV == 'true'
        run: |
          npm install -g @railway/cli
          if [ -n "$RAILWAY_TOKEN" ] && [ -n "$RAILWAY_PROJECT_ID" ] && npm run release:railway:check -- --project="$RAILWAY_PROJECT_ID" --environment=production --service=agentlas-web; then
            echo "AGENTLAS_RAILWAY_RELEASE_READY=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Railway release env credentials are missing or invalid. macOS release will still publish; apply desktop web env manually after release."
            echo "AGENTLAS_RAILWAY_RELEASE_READY=0" >> "$GITHUB_ENV"
          fi

      - name: Restore mac signing certificate
        run: |
          cert_path="$RUNNER_TEMP/agentlas-developer-id.p12"
          printf '%s' "$MAC_DEVELOPER_ID_CERTIFICATE" | base64 -D > "$cert_path"
          test -s "$cert_path"
          echo "CSC_LINK=$cert_path" >> "$GITHUB_ENV"

      # Clone the git-ignored Hephaestus engine so the signed .app embeds it.
      - name: Ensure embedded engine (Hephaestus)
        run: npm run ensure:engine

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 실제 장애가 난 Browser 소유권/스크롤과, typecheck만으로 못 잡았던
      # 에이전트 피커·사이드바 렌더러 회귀를 릴리스 전에 함께 막는다.
      - name: Browser and renderer UI regression gates
        run: |
          npx playwright install chromium
          npm run test:browser-approval-gate
          npm run test:browser-approval-concurrency
          npm run test:browser-legacy-credential-scrub
          npm run test:browser-profile-isolation
          npm run test:browser-password-boundary
          npm run test:browser-ui
          npm run smoke:renderer-ui

      - name: Build, sign, notarize, and verify DMGs
        run: npm run package:mac

      # Publish notarized .dmg/.zip + latest-mac.yml to the public releases repo
      # (AGENTLAS_DESKTOP_GITHUB_REPO) — this is the public download + update feed.
      - name: Publish verified release (public releases repo)
        run: |
          args=(--tag="$RESOLVED_TAG" --version="$RESOLVED_VERSION")
          if [ "$RESOLVED_DRAFT" = "true" ]; then args+=(--draft); fi
          npm run release:mac:publish -- "${args[@]}"

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: agentlas-desktop-release-evidence
          path: |
            release/desktop-release-verification.json
            release/desktop-release.production.env
            release/latest-mac.yml
          if-no-files-found: error

      - name: Apply Railway web release env
        if: env.RESOLVED_APPLY_WEB_ENV == 'true' && env.AGENTLAS_RAILWAY_RELEASE_READY == '1'
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            railway link --project "$RAILWAY_PROJECT_ID" --environment production --service agentlas-web
          fi
          npm run release:web-env -- --apply --restart --verify-url=https://agentlas.cloud/api/desktop/latest
