            "scripts/test-toolchain-apps.cjs": "ab8c4009fd12ee9efccbbc85487bb98ef0836469402147581bf0c06be1503574",
            "scripts/verify-agentlas-one-ui.cjs": "8087486beaffbb0cc825f637af4926ec55527941adf6e76992dfa25db996f2fe",
            "scripts/verify-build-recovery.mjs": "aa62f09ba3511d75762393cb747bf6654ef666c91b0cb90ef6bde61ed037f7fe",
            "scripts/verify-builtin-plugins-degrade.mjs": "47801c16ef3dd39c0da35d56103f8ba3eca3d179f4ce5ca8b73a8f556324eaaf",
            "scripts/verify-one-composer-surface.mjs": "4dc0eec040819d5db15d1e0e48ee866a139e33d8f3ff525cb25b3c75e5445f08",
            "scripts/verify-one-team-permission-boundary.mjs": "f2373e909cd59c6957d6014fe6ab6f3e0a924b13b335f1d06ff8beaef353a126",
            "scripts/verify-one-team-surface.mjs": "a799e9842b1a404937ce9494fe543de2dec7510a9ee8026ad5cdf883bcdc50a1",
            "scripts/current-sidebar-route-contract.cjs": "46d8f58f57e0a7a93cbde54582387d4f937e9f2bf07cd50956eb6520eb004f37"
          }));
          if (manifest.files?.length !== 45 || approvedPins.size !== 45) throw new Error('All 44 original private Mac entries plus the exact sealed R7 sidebar helper are required');
          if (manifest.schema !== 'agentlas.private-release-verification.v1' || !Array.isArray(manifest.files)) throw new Error('Invalid private verification manifest');
          const seen = new Set();
          const sourceCommit = require('node:child_process').execFileSync('git', ['rev-parse', '--verify', 'HEAD^{commit}']).toString().trim();
          const sourcePaths = new Set(require('node:child_process').execFileSync('git', ['ls-tree', '-r', '--name-only', '-z', sourceCommit]).toString().split('\0'));
          for (const entry of manifest.files) {
            if (!/^scripts\/(?:[A-Za-z0-9_-]+\/)*[A-Za-z0-9_.-]+$/.test(entry.path) || entry.path.includes('..') || seen.has(entry.path)) throw new Error('Invalid verification path');
            seen.add(entry.path);
            if (!approvedPins.has(entry.path) || entry.sha256 !== approvedPins.get(entry.path)) throw new Error('Private Mac verification filename or approved digest changed');
            const bytes = require('node:child_process').execFileSync('git', ['-C', '.release-private-verification', 'show', `${process.env.AGENTLAS_MAC_PRIVATE_VERIFICATION_REF}:release-verification/desktop/${entry.path}`]);
            if (crypto.createHash('sha256').update(bytes).digest('hex') !== entry.sha256) throw new Error('Verification file digest mismatch');
            if (sourcePaths.has(entry.path)) {
              if (!fs.existsSync(entry.path) || !fs.lstatSync(entry.path).isFile()) throw new Error('Committed runtime file is missing from the release source');
              const committed = require('node:child_process').execFileSync('git', ['show', `${sourceCommit}:${entry.path}`]);
              if (!fs.readFileSync(entry.path).equals(committed)) throw new Error('Committed runtime file differs from the release source');
              continue;
            }
            if (fs.existsSync(entry.path)) throw new Error('Private verification target is untracked and already exists');
            fs.mkdirSync(path.dirname(entry.path), { recursive: true });
            fs.writeFileSync(entry.path, bytes);
          }
          console.log(`Installed ${seen.size} private verification files from the pinned release`);
          NODE

      - name: Install publisher dependencies
        shell: bash
        env:
          AGENTLAS_SCIENCE_GITHUB_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
        run: |
          git_config="$RUNNER_TEMP/agentlas-science-gitconfig"
          trap 'rm -f "$git_config"' EXIT
          test -n "$AGENTLAS_SCIENCE_GITHUB_TOKEN"
          umask 077
          cat > "$git_config" <<EOF
          [url "https://x-access-token:${AGENTLAS_SCIENCE_GITHUB_TOKEN}@github.com/agentlas-ai/agentlas-science.git"]
              insteadOf = ssh://git@github.com/agentlas-ai/agentlas-science.git
              insteadOf = git+ssh://git@github.com/agentlas-ai/agentlas-science.git
              insteadOf = git@github.com:agentlas-ai/agentlas-science.git
          EOF
          GIT_CONFIG_GLOBAL="$git_config" npm ci --ignore-scripts --no-audit

      - name: Download every barrier-approved OS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agentlas-release-*
          path: release
          merge-multiple: true

      - name: Verify local required manifest and hashes before first public write
        run: >-
          npm run release:assets:verify --
          --release-dir=release
          --tag="$RESOLVED_TAG"
          --version="$RESOLVED_VERSION"
          --public-allowlist
          --build-outputs-only

      - name: Install pinned Railway CLI before stable publication
        if: env.RESOLVED_DRAFT != 'true'
        run: npm install -g @railway/cli@5.26.0

      - name: Gate stable writer on exact production Railway access
        if: env.RESOLVED_DRAFT != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          test -n "$RAILWAY_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          npm run release:railway:check -- --project="$RAILWAY_PROJECT_ID" --environment=production --service=agentlas-web
          echo "AGENTLAS_RAILWAY_RELEASE_READY=1" >> "$GITHUB_ENV"
          echo "AGENTLAS_RAILWAY_PROJECT_VERIFIED=$RAILWAY_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Single releases-repository writer and stable promotion
        env:
          GH_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
        run: |
          args=(--tag="$RESOLVED_TAG" --version="$RESOLVED_VERSION")
          if [ "$RESOLVED_DRAFT" = "true" ]; then args+=(--draft); fi
          npm run release:mac:publish -- "${args[@]}"

      - name: Apply and verify production desktop release metadata
        if: env.RESOLVED_APPLY_WEB_ENV == 'true' && env.RESOLVED_DRAFT != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          test -n "$RAILWAY_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          npm run release:railway:check -- --project="$RAILWAY_PROJECT_ID" --environment=production --service=agentlas-web
          npm run release:web-env -- --apply --redeploy --verification-file=release/desktop-release-verification.json --expected-version="$RESOLVED_VERSION" --expected-tag="$RESOLVED_TAG" --environment=production --service=agentlas-web --verify-url=https://agentlas.cloud/api/desktop/latest

      - name: Upload complete release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentlas-desktop-release-evidence
          path: |
            release/desktop-release-verification.json
            release/latest-mac.yml
            release/update-lineage-verification.json
            release/release-asset-manifest.json
          if-no-files-found: warn
