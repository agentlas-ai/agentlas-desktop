name: Cross-platform Core harness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "electron/**"
      - "renderer/**"
      - "shared/**"
      - "scripts/**"
      - "build-resources/**"
      - "electron-builder*.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cross-platform-harness.yml"
      - ".github/workflows/dependency-security.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-signed-mac.yml"
  push:
    branches: [main]
    paths:
      - "electron/**"
      - "renderer/**"
      - "shared/**"
      - "scripts/**"
      - "build-resources/**"
      - "electron-builder*.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cross-platform-harness.yml"
      - ".github/workflows/dependency-security.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-signed-mac.yml"

concurrency:
  group: desktop-core-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan affected Desktop CI scopes
    runs-on: ubuntu-24.04
    outputs:
      fast: ${{ steps.scope.outputs.fast }}
      core: ${{ steps.scope.outputs.core }}
      one: ${{ steps.scope.outputs.one }}
      agent_app: ${{ steps.scope.outputs.agent_app }}
      updater: ${{ steps.scope.outputs.updater }}
      packaging: ${{ steps.scope.outputs.packaging }}
      metadata_only: ${{ steps.scope.outputs.metadata_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
      - name: Verify the fail-closed scope planner
        run: node scripts/ci-scope-plan.cjs --self-test
      - name: Classify the changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/ci-scope-plan.cjs
          --event="${{ github.event_name }}"
          --base="$BASE_SHA"
          --head="$HEAD_SHA"

  fast-checks:
    name: Fast Desktop type contracts
    needs: plan
    if: needs.plan.outputs.fast == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install typecheck dependencies without native postinstall rebuilds
        run: npm ci --ignore-scripts --no-audit
      - name: Typecheck renderer and main process
        run: npm run typecheck

  desktop-harness:
    name: ${{ matrix.os }}
    needs: plan
    if: >-
      needs.plan.outputs.core == 'true' ||
      needs.plan.outputs.agent_app == 'true' ||
      needs.plan.outputs.packaging == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: agentlas-desktop
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: agentlas-ai/Agentlas-OS
          ref: 3061292495b08d513dd5fcf2025a96d85813b627
          path: agentlas-desktop/Hephaestus
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: agentlas-desktop/package-lock.json
      - name: Verify Core source pin
        working-directory: agentlas-desktop/Hephaestus
        shell: bash
        run: test "$(git rev-parse HEAD)" = "3061292495b08d513dd5fcf2025a96d85813b627"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Linux keychain runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0
      - name: Install Desktop dependencies
        working-directory: agentlas-desktop
        run: npm ci --no-audit
      - name: Compile Desktop main process
        working-directory: agentlas-desktop
        run: npm run build:electron
      - name: Verify workforce runtime orchestration on Linux
        if: needs.plan.outputs.core == 'true' && runner.os == 'Linux'
        working-directory: agentlas-desktop
        run: |
          # Call electron directly with --no-sandbox, matching every other Linux step here.
          # `npm run test:*` routes through package.json, which launches bare `electron` — the
          # flag is lost and Chromium aborts on the SUID sandbox helper (chrome-sandbox must be
          # root:4755, which a GitHub runner cannot provide). The main process is already
          # compiled by the "Compile Desktop main process" step above.
          # Core/Desktop vector parity is proved privately before release because its
          # benchmark fixtures are intentionally absent from the public Core runtime.
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-borrowed-task-force.cjs
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-borrowed-agent-fail-closed.cjs
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-workload-routing.cjs
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-build-workload-routing.cjs
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-hephaestus-settings-migration.cjs
          npm run test:auto-router-gates
      - name: Verify workforce runtime orchestration on macOS and Windows
        if: needs.plan.outputs.core == 'true' && runner.os != 'Linux'
        working-directory: agentlas-desktop
        shell: bash
        run: |
          # The full borrowed-team fixture has a Windows-only temp-directory release race
          # after all assertions pass. Keep that proof on Linux/macOS and run the shared
          # platform-safe allocation contracts on Windows.
          if [ "${{ runner.os }}" = "macOS" ]; then
            npm run test:borrowed-task-force
          fi
          npm run test:workload-routing
          npm run test:build-workload-routing
          npm run test:hephaestus-settings-migration
          npm run test:auto-router-gates
      - name: Verify installed Core on Linux
        if: needs.plan.outputs.core == 'true' && runner.os == 'Linux'
        working-directory: agentlas-desktop
        env:
          HEPHAESTUS_RUNTIME_ROOT: ${{ github.workspace }}/agentlas-desktop/Hephaestus
          HEPHAESTUS_PYTHON: python
          AGENTLAS_HARNESS_PROOF_PATH: ${{ runner.temp }}/desktop-harness-proof.json
        run: |
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-stormbreaker-core-harness.cjs --installed
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-owned-agent-runtime-prompts.cjs
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-project-bootstrap-desktop.cjs
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-project-bootstrap-core.cjs
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-project-memory-read-boundary.cjs
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-v56-experience-cloud-migration.cjs
          node scripts/test-codex-model-discovery.cjs
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-stormbreaker-swarm-contract.cjs
          node scripts/test-swarm-engine.cjs
          node scripts/test-automation-result-contract.cjs
      - name: Verify installed Core on macOS and Windows
        if: needs.plan.outputs.core == 'true' && runner.os != 'Linux'
        working-directory: agentlas-desktop
        shell: bash
        env:
          HEPHAESTUS_RUNTIME_ROOT: ${{ github.workspace }}/agentlas-desktop/Hephaestus
          HEPHAESTUS_PYTHON: python
          AGENTLAS_HARNESS_PROOF_PATH: ${{ runner.temp }}/desktop-harness-proof.json
        run: |
          npx --no-install electron scripts/test-stormbreaker-core-harness.cjs --installed
          npx --no-install electron scripts/test-owned-agent-runtime-prompts.cjs
          npx --no-install electron scripts/test-project-bootstrap-desktop.cjs
          npx --no-install electron scripts/test-project-bootstrap-core.cjs
          npx --no-install electron scripts/test-project-memory-read-boundary.cjs
          npx --no-install electron scripts/test-v56-experience-cloud-migration.cjs
          node scripts/test-codex-model-discovery.cjs
          npx --no-install electron scripts/test-stormbreaker-swarm-contract.cjs
          node scripts/test-swarm-engine.cjs
          node scripts/test-automation-result-contract.cjs
      - name: Verify Agent App MCP boundary on Linux
        if: needs.plan.outputs.agent_app == 'true' && runner.os == 'Linux'
        working-directory: agentlas-desktop
        shell: bash
        run: |
          xvfb-run -a node scripts/test-site-agent-app-isolation.cjs
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-site-agent-app-capabilities.cjs
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-site-agent-app-mcp-consent.cjs
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-site-agent-app-prebuild-mcp.cjs
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-site-agent-app-claude-runtime-isolation.cjs
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-site-agent-app-firm-isolation.cjs
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-site-agent-app-group-isolation.cjs
          xvfb-run -a npx --no-install electron --no-sandbox scripts/test-site-agent-app-runtime.cjs
      - name: Verify Agent App declared capabilities on macOS and Windows
        if: needs.plan.outputs.agent_app == 'true' && runner.os != 'Linux'
        working-directory: agentlas-desktop
        shell: bash
        run: npx --no-install electron scripts/test-site-agent-app-capabilities.cjs
      - name: Verify Agent App MCP consent on macOS and Windows
        if: needs.plan.outputs.agent_app == 'true' && runner.os != 'Linux'
        working-directory: agentlas-desktop
        shell: bash
        run: npx --no-install electron scripts/test-site-agent-app-mcp-consent.cjs
      - name: Verify Agent App prebuild MCP on macOS and Windows
        if: needs.plan.outputs.agent_app == 'true' && runner.os != 'Linux'
        working-directory: agentlas-desktop
        shell: bash
        run: npx --no-install electron scripts/test-site-agent-app-prebuild-mcp.cjs
      - name: Verify Agent App Claude isolation on macOS and Windows
        if: needs.plan.outputs.agent_app == 'true' && runner.os != 'Linux'
        working-directory: agentlas-desktop
        shell: bash
        run: npx --no-install electron scripts/test-site-agent-app-claude-runtime-isolation.cjs
      - name: Verify Agent App firm isolation on macOS and Windows
        if: needs.plan.outputs.agent_app == 'true' && runner.os != 'Linux'
        working-directory: agentlas-desktop
        shell: bash
        run: npx --no-install electron scripts/test-site-agent-app-firm-isolation.cjs
      - name: Verify Agent App group isolation on macOS and Windows
        if: needs.plan.outputs.agent_app == 'true' && runner.os != 'Linux'
        working-directory: agentlas-desktop
        shell: bash
        run: npx --no-install electron scripts/test-site-agent-app-group-isolation.cjs
      - name: Verify Agent App runtime on macOS and Windows
        if: needs.plan.outputs.agent_app == 'true' && runner.os != 'Linux'
        working-directory: agentlas-desktop
        shell: bash
        run: npx --no-install electron scripts/test-site-agent-app-runtime.cjs
      - name: Build and verify packaged Agent App MCP boundary
        if: >-
          (needs.plan.outputs.agent_app == 'true' || needs.plan.outputs.packaging == 'true') &&
          runner.os != 'macOS'
        working-directory: agentlas-desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run build
          npm run fetch:python
          if [ "${{ runner.os }}" = "Windows" ]; then npm run fetch:node; fi
          npx --no-install electron-builder --dir --publish never --config.directories.output="${{ runner.temp }}/agentlas-package-smoke" -c.mac.identity=null -c.mac.notarize=false
          npm run test:packaged-agent-app-mcp -- "${{ runner.temp }}/agentlas-package-smoke"
      - name: Build and verify isolated macOS local-candidate Agent App MCP boundary
        if: >-
          (needs.plan.outputs.agent_app == 'true' || needs.plan.outputs.packaging == 'true') &&
          runner.os == 'macOS'
        working-directory: agentlas-desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run fetch:python
          npx --no-install electron-builder --dir --publish never --config electron-builder.mac-local.yml --config.directories.output="${{ runner.temp }}/agentlas-local-candidate-package-smoke" -c.mac.identity=null -c.mac.notarize=false
          node scripts/verify-local-mac-candidate.mjs --output="${{ runner.temp }}/agentlas-local-candidate-package-smoke"
          npm run test:packaged-agent-app-mcp -- "${{ runner.temp }}/agentlas-local-candidate-package-smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.plan.outputs.core == 'true'
        with:
          name: desktop-harness-proof-${{ runner.os }}
          path: ${{ runner.temp }}/desktop-harness-proof.json
          if-no-files-found: error

  one-contracts:
    name: Agentlas One public contracts
    needs: plan
    if: needs.plan.outputs.one == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: agentlas-desktop
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: agentlas-ai/Agentlas-OS
          ref: 3061292495b08d513dd5fcf2025a96d85813b627
          path: agentlas-desktop/Hephaestus
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: agentlas-desktop/package-lock.json
      - name: Install Desktop dependencies
        working-directory: agentlas-desktop
        run: npm ci --no-audit
      - name: Compile Desktop main process
        working-directory: agentlas-desktop
        run: npm run build:electron
      - name: Verify public-source Agentlas One contracts
        working-directory: agentlas-desktop
        shell: bash
        # Private sibling fixtures and the hosted-runner-sensitive timed producer
        # remain in the complete local release audit. Public CI executes only
        # deterministic contracts whose required inputs are in this repository.
        run: |
          node <<'NODE'
          const { execSync } = require("node:child_process");
          const scripts = require("./package.json").scripts;
          const localReleaseAuditVerifiers = new Set([
            "test:one-artifact-preview-ui",
            "test:one-improvement-proof-runtime",
            "test:one-surface-runtime-contract",
            "test:one-value-closure-runtime",
            "test:one-activation-runtime",
            "test:one-improvement-proof-producer",
            "test:one-ui",
          ]);
          const publicCommands = scripts["test:one"]
            .split(" && ")
            .filter((command) => ![...localReleaseAuditVerifiers].some((name) => command === `npm run ${name}`));
          execSync(publicCommands.join(" && "), { stdio: "inherit", shell: true });
          NODE

  compare-desktop-proofs:
    name: Compare Desktop prompt bytes
    needs: [plan, desktop-harness]
    if: needs.plan.outputs.core == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-harness-proof-*
          path: proofs
      - run: node scripts/compare-stormbreaker-platform-proofs.cjs proofs

  updater-ui:
    name: Updater renderer UI
    needs: plan
    if: needs.plan.outputs.updater == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install renderer test dependencies
        run: npm ci --no-audit
      - name: Build updater UI and reject forced reinstall copy
        run: |
          npm run build:renderer
          npm run build:electron
          npm run test:mac-install-transaction
          if rg -n -i '홈페이지|다시 설치|재설치|website|reinstall|re-download|redownload|공식 설치' \
            renderer/components/UpdateBanner.tsx \
            renderer/components/VersionChip.tsx \
            'renderer/app/(shell)/settings/page.tsx'; then
            echo "::error::Updater surfaces must recover in app and must not force a website reinstall."
            exit 1
          fi

  ci-result:
    name: Desktop CI required result
    if: ${{ always() }}
    needs:
      - plan
      - fast-checks
      - desktop-harness
      - one-contracts
      - compare-desktop-proofs
      - updater-ui
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected scope to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          FAST_RESULT: ${{ needs.fast-checks.result }}
          DESKTOP_RESULT: ${{ needs.desktop-harness.result }}
          ONE_RESULT: ${{ needs.one-contracts.result }}
          PROOF_RESULT: ${{ needs.compare-desktop-proofs.result }}
          UPDATER_RESULT: ${{ needs.updater-ui.result }}
        run: |
          for result in "$PLAN_RESULT" "$FAST_RESULT" "$DESKTOP_RESULT" "$ONE_RESULT" "$PROOF_RESULT" "$UPDATER_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A selected Desktop CI scope did not pass (result=$result)."; exit 1 ;;
            esac
          done
          echo "Every affected Desktop CI scope passed; unrelated suites were skipped."
