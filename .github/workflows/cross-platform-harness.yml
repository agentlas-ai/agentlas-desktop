name: Cross-platform Core harness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "electron/hephaestus/commands.ts"
      - "electron/hephaestus/engine.ts"
      - "electron/hephaestus/loop-engineering.ts"
      - "electron/mcp/client.ts"
      - "scripts/test-stormbreaker-core-harness.cjs"
      - "scripts/test-owned-agent-runtime-prompts.cjs"
      - ".github/workflows/cross-platform-harness.yml"
  push:
    branches: [main]
    paths:
      - "electron/hephaestus/commands.ts"
      - "electron/hephaestus/engine.ts"
      - "electron/hephaestus/loop-engineering.ts"
      - "electron/mcp/client.ts"
      - "scripts/test-stormbreaker-core-harness.cjs"
      - "scripts/test-owned-agent-runtime-prompts.cjs"
      - ".github/workflows/cross-platform-harness.yml"

permissions:
  contents: read

jobs:
  desktop-harness:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: agentlas-desktop
      - uses: actions/checkout@v4
        with:
          repository: agentlas-ai/Agentlas-OS
          path: Agentlas-OS
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agentlas-desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux keychain runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0
      - name: Install Desktop dependencies
        working-directory: agentlas-desktop
        run: npm ci
      - name: Compile Desktop main process
        working-directory: agentlas-desktop
        run: npm run build:electron
      - name: Verify installed Core on Linux
        if: runner.os == 'Linux'
        working-directory: agentlas-desktop
        env:
          HEPHAESTUS_RUNTIME_ROOT: ${{ github.workspace }}/Agentlas-OS
          HEPHAESTUS_PYTHON: python
          AGENTLAS_HARNESS_PROOF_PATH: ${{ runner.temp }}/desktop-harness-proof.json
        run: |
          xvfb-run -a npx electron --no-sandbox scripts/test-stormbreaker-core-harness.cjs --installed
          xvfb-run -a npx electron --no-sandbox scripts/test-owned-agent-runtime-prompts.cjs
      - name: Verify installed Core on macOS and Windows
        if: runner.os != 'Linux'
        working-directory: agentlas-desktop
        env:
          HEPHAESTUS_RUNTIME_ROOT: ${{ github.workspace }}/Agentlas-OS
          HEPHAESTUS_PYTHON: python
          AGENTLAS_HARNESS_PROOF_PATH: ${{ runner.temp }}/desktop-harness-proof.json
        run: |
          npx electron scripts/test-stormbreaker-core-harness.cjs --installed
          npx electron scripts/test-owned-agent-runtime-prompts.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-harness-proof-${{ runner.os }}
          path: ${{ runner.temp }}/desktop-harness-proof.json
          if-no-files-found: error

  compare-desktop-proofs:
    name: Compare Desktop prompt bytes
    needs: desktop-harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-harness-proof-*
          path: proofs
      - run: node scripts/compare-stormbreaker-platform-proofs.cjs proofs
