# Cross-platform release build — verifies and packages Windows / Linux into
# GitHub Actions artifacts only. It never writes the public releases repository.
# The signed macOS workflow consumes these artifacts after every OS gate passes
# and owns the single atomic staging/promotion boundary.
#
# The embedded Hephaestus engine is git-ignored, so a fresh checkout has no
# engine — `npm run ensure:engine` clones the public engine repo before build.
#
# These builds are UNSIGNED (no Windows certificate required). macOS is
# intentionally excluded here: public Mac releases must come from
# scripts/package-mac.sh with Developer ID signing + notarization, otherwise
# users can get a "newer" DMG that cannot safely auto-update.
# For the signed + notarized macOS pipeline, see docs/PUBLIC-RELEASE.md.
#
# A manual run is build-only; it cannot publish a release.
name: Cross-platform Release Build

on:
  workflow_call:
    inputs:
      tag:
        description: "Exact stable source tag to package"
        required: true
        type: string
      harness_ref:
        description: "Immutable workflow commit that supplies release-only verification code"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag (e.g. v0.8.21). Must match package.json version."
        required: true
      harness_ref:
        description: "Optional immutable commit for release-only verification code (defaults to this workflow commit)"
        required: false

permissions:
  contents: read

jobs:
  opencrab-security-preflight:
    name: OpenCrab security preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HEPHAESTUS_REF: v1.1.50
      HEPHAESTUS_COMMIT: 5fc22464c1db33dabc0d4de2170053d1584b5682

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev xvfb dbus-x11

      - name: Verify preflight source and engine pin
        shell: bash
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RAW_TAG"
          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$tag" =~ $semver_tag_re ]]; then
            echo "::error::Release tag must be stable SemVer with a leading v and no prerelease suffix (received: $tag)."
            exit 1
          fi
          tagged_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")" || {
            echo "::error::Release tag $tag does not exist in refs/tags."
            exit 1
          }
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tagged_commit" ]; then
            echo "::error::Checked-out HEAD $head_commit does not match $tag ($tagged_commit)."
            exit 1
          fi
          version="${tag#v}"
          pkgver=$(node -p "require('./package.json').version")
          lockver=$(node -p "require('./package-lock.json').version")
          lockrootver=$(node -p "require('./package-lock.json').packages[''].version")
          runtimever=$(node -p "require('./package.json').agentlasUpdateCompatibility.bundledRuntimeVersion")
          runtimecommit=$(node -p "require('./package.json').agentlasBundledRuntimeSource.commit")
          if [ "$pkgver" != "$version" ] || [ "$lockver" != "$version" ] || [ "$lockrootver" != "$version" ]; then
            echo "::error::Tag $tag requires package.json/package-lock root version=$version (got package=$pkgver lock=$lockver root=$lockrootver)."
            exit 1
          fi
          if [ "${HEPHAESTUS_REF#v}" != "$runtimever" ]; then
            echo "::error::HEPHAESTUS_REF=$HEPHAESTUS_REF does not match bundledRuntimeVersion=$runtimever."
            exit 1
          fi
          if [ "$HEPHAESTUS_COMMIT" != "$runtimecommit" ]; then
            echo "::error::HEPHAESTUS_COMMIT does not match package immutable runtime pin."
            exit 1
          fi
          echo "Preflight source verified: $tag ($head_commit), Agentlas OS $HEPHAESTUS_REF"

      - name: Ensure embedded engine (Hephaestus)
        run: npm run ensure:engine

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: OpenCrab security regression gates
        env:
          # Hosted Linux has no user Secret Service. The Electron tests must use
          # the in-memory E2E vault rather than touching a runner keychain.
          AGENTLAS_E2E: "1"
        run: |
          node node_modules/electron/install.js
          sandbox_path="$(find node_modules/electron -maxdepth 4 -name chrome-sandbox -print -quit)"
          if [ -z "$sandbox_path" ]; then
            echo "::error::Electron Linux binary installed without the required chrome-sandbox helper."
            exit 1
          fi
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          echo "Configured Electron SUID sandbox helper: $sandbox_path"
          xvfb-run -a dbus-run-session -- bash -eo pipefail -c '
            npm run test:stormbreaker-core:embedded
            npm run test:python-cache-boundary
            npm run test:release-agent-foundation-gate
            npm run test:v64-automation-permission-migration
            npm run test:automations-store
            npm run test:automation-result-contract
            npm run test:automation-scheduler-guards
            npm run test:mobile-execution-boundary
            npm run test:runtime-resume-contract
            npm run test:cli-image-attachments
            npm run test:owned-agent-runtime-prompts
            npm run test:borrowed-task-force
            npm run test:workload-routing
            npm run test:build-workload-routing
            npm run test:hephaestus-settings-migration
            npm run test:auto-router-gates
            npm run test:opencrab-core
            npm run test:opencrab-product
            npm run test:opencrab-recovery-scrub
            npm run test:mock-bridge-parity
            npm run test:mcp-secret-isolation
          '

  build-cross-platform:
    needs: opencrab-security-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_args: --win
          - os: ubuntu-latest
            builder_args: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HEPHAESTUS_REF: v1.1.50
      HEPHAESTUS_COMMIT: 5fc22464c1db33dabc0d4de2170053d1584b5682

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # keytar links against libsecret on Linux.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev xvfb dbus-x11

      # Tag must match package.json version so the auto-update feed is consistent.
      - name: Verify tag matches package.json version
        shell: bash
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RAW_TAG"
          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$tag" =~ $semver_tag_re ]]; then
            echo "::error::Release tag must be stable SemVer with a leading v and no prerelease suffix (received: $tag)."
            exit 1
          fi
          tagged_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")" || {
            echo "::error::Release tag $tag does not exist in refs/tags."
            exit 1
          }
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tagged_commit" ]; then
            echo "::error::Checked-out HEAD $head_commit does not match $tag ($tagged_commit)."
            exit 1
          fi
          version="${tag#v}"
          pkgver=$(node -p "require('./package.json').version")
          lockver=$(node -p "require('./package-lock.json').version")
          lockrootver=$(node -p "require('./package-lock.json').packages[''].version")
          runtimever=$(node -p "require('./package.json').agentlasUpdateCompatibility.bundledRuntimeVersion")
          runtimecommit=$(node -p "require('./package.json').agentlasBundledRuntimeSource.commit")
          if [ "$pkgver" != "$version" ] || [ "$lockver" != "$version" ] || [ "$lockrootver" != "$version" ]; then
            echo "::error::Tag $tag requires package.json/package-lock root version=$version (got package=$pkgver lock=$lockver root=$lockrootver)."
            exit 1
          fi
          if [ "${HEPHAESTUS_REF#v}" != "$runtimever" ]; then
            echo "::error::HEPHAESTUS_REF=$HEPHAESTUS_REF does not match bundledRuntimeVersion=$runtimever."
            exit 1
          fi
          if [ "$HEPHAESTUS_COMMIT" != "$runtimecommit" ]; then
            echo "::error::HEPHAESTUS_COMMIT does not match package immutable runtime pin."
            exit 1
          fi
          echo "RESOLVED_TAG=$tag" >> "$GITHUB_ENV"
          echo "Releasing $tag (version $version)"

      # Clone the git-ignored Hephaestus engine so extraResources can embed it.
      - name: Ensure embedded engine (Hephaestus)
        run: npm run ensure:engine

      - name: Install dependencies
        run: npm ci

      - name: Fetch SHA-256-pinned standalone Python for the package
        run: npm run fetch:python

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Typecheck
        if: runner.os == 'Linux'
        run: npm run typecheck

      - name: Build Cloud save choice contract
        run: npm run test:build-cloud-save-choice

      - name: Windows runtime and mobile contracts
        if: runner.os == 'Windows'
        timeout-minutes: 15
        run: |
          npm run test:updater-production
          npm run test:cli-version-parser
          npm run test:stormbreaker-core:embedded
          npm run test:stormbreaker-swarm
          npm run test:python-cache-boundary
          npm run test:release-agent-foundation-gate
          npm run test:runtime-resume-contract
          npm run test:mobile-bridge-contract
          npm run test:mobile-execution-boundary
          npm run test:v64-automation-permission-migration
          npm run test:provider-health

      - name: Linux migration and updater continuity gates
        if: runner.os == 'Linux'
        env:
          # Hosted Linux has no gnome-keyring/secret-service, so keytar-backed vault
          # reads (mcp-auto-select) abort with "org.freedesktop.secrets was not
          # provided". E2E mode uses an in-memory vault and skips keytar entirely.
          AGENTLAS_E2E: "1"
        run: |
          # Electron 43 downloads its platform binary lazily. Install it before
          # locating the Linux SUID helper, otherwise the first test downloads an
          # unconfigured helper and Chromium aborts with SIGTRAP.
          node node_modules/electron/install.js
          sandbox_path="$(find node_modules/electron -maxdepth 4 -name chrome-sandbox -print -quit)"
          if [ -z "$sandbox_path" ]; then
            echo "::error::Electron Linux binary installed without the required chrome-sandbox helper."
            exit 1
          fi
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          echo "Configured Electron SUID sandbox helper: $sandbox_path"
          # Run the electron gates inside a real X (xvfb) AND a session bus
          # (dbus-run-session). Without a session bus, electron reads
          # DBUS_SESSION_BUS_ADDRESS=disabled and aborts with
          # "Unknown or unsupported transport 'disabled'". One session for all gates.
          xvfb-run -a dbus-run-session -- bash -eo pipefail -c '
            npm run test:v52-automation-run-recovery
            npm run test:v64-automation-permission-migration
            npm run test:automation-trigger-safety
            npm run test:question-answer-receipt
            npm run test:v53-hub-bookmark-sync
            npm run test:updater-production
            npm run test:automations-store
            npm run test:automation-result-contract
            npm run test:cli-version-parser
            npm run test:hephaestus-status-version
            npm run test:python-cache-boundary
            npm run test:release-agent-foundation-gate
            npm run test:runtime-resume-contract
            npm run test:marketplace-cache
            npm run test:stormbreaker-core:embedded
            npm run test:stormbreaker-swarm
            npm run test:provider-health
            npm run test:mobile-bridge-contract
            npm run test:mobile-execution-boundary
            npm run test:borrowed-task-force
            npm run test:workload-routing
            npm run test:build-workload-routing
            npm run test:hephaestus-settings-migration
            npm run test:auto-router-gates
            npm run test:mcp-auto-select
            npm run test:mcp-secret-isolation
            # Experience Ontology: real Memory attribution, legacy recovery,
            # privacy-safe candidate intake, exact Hub bindings, portable Cloud
            # assets, and Desktop/Mobile/Terminal state boundaries.
            npm run build:electron
            npx --no-install electron scripts/test-memory-recall-injection.cjs
            node scripts/test-ontology-ingest-wiring.cjs
            npx --no-install electron scripts/test-sitemap-readable.cjs
            npx --no-install electron scripts/test-memory-agent-isolation.cjs
            npx --no-install electron scripts/test-legacy-experience-reconciliation.cjs
            npx --no-install electron scripts/test-v58-memory-curation-migration.cjs
            npx --no-install electron scripts/test-v59-ontology-binding-migration.cjs
            npm run test:terminal-ontology-loadout-feed
            npx --no-install electron scripts/test-experience-p0.cjs
            npx --no-install electron scripts/test-experience-taxonomy-parity.cjs
            npx --no-install electron scripts/test-v55-experience-relations-migration.cjs
            npx --no-install electron scripts/test-experience-relation-index.cjs
            node scripts/test-portable-experience-hash-golden.cjs
            npx --no-install electron scripts/test-v56-experience-cloud-migration.cjs
            npx --no-install electron scripts/test-experience-cloud-exchange.cjs
            npx --no-install electron scripts/test-mobile-ontology-bridge.cjs
            npm run test:opencrab-core
            npm run test:opencrab-product
            npm run test:mock-bridge-parity
            npm run test:hephaestus-sync
            npm run test:telegram-automation-report-fanout
          '

      - name: Build renderer + electron
        run: npm run build

      # Tests run after the initial clone. Recheck the immutable commit and the
      # ignored-file boundary immediately before electron-builder sees Core.
      - name: Reverify embedded engine release boundary
        run: npm run ensure:engine

      # Tests and native rebuilds run for several minutes after the first
      # fetch. Re-materialize the immutable platform asset at the final package
      # boundary so no stale/cross-arch directory can reach electron-builder.
      - name: Reverify pinned standalone Python at package boundary
        run: npm run fetch:python

      - name: Package verified Actions artifacts only
        shell: bash
        run: |
          npx electron-builder ${{ matrix.builder_args }} --publish never
          node scripts/stamp-update-feeds.mjs --release-dir=release --require

      - name: Verify packaged Windows Python and Workforce MCP
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/verify-packaged-workforce-runtime.cjs --resources=release/win-unpacked/resources

      - name: Verify packaged Linux Python and Workforce MCP
        if: runner.os == 'Linux'
        shell: bash
        run: node scripts/verify-packaged-workforce-runtime.cjs --resources=release/linux-unpacked/resources

      - name: Upload Windows/Linux package set for the release barrier
        uses: actions/upload-artifact@v4
        with:
          name: agentlas-release-${{ runner.os }}
          path: |
            release/Agentlas-*-Windows-x64-Setup.exe
            release/Agentlas-*-Windows-x64-Setup.exe.blockmap
            release/Agentlas-*-Windows-x64-Portable.exe
            release/Agentlas-*-Linux-x64.AppImage
            release/Agentlas-*-Linux-x64.deb
            release/latest.yml
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 3

  # Package/unit contracts cannot prove that a previous installed release can
  # actually download, replace itself, restart, and reconcile its durable
  # journal. Exercise that lifecycle on the native target OS before the
  # reusable workflow can satisfy the all-OS public-release barrier.
  updater-install-e2e:
    name: Native updater install E2E (${{ matrix.label }})
    needs: build-cross-platform
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            artifact_os: Windows
            label: Windows NSIS
          - os: ubuntu-latest
            platform: linux
            artifact_os: Linux
            label: Linux AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # The test launches a real AppImage under a virtual display. It refuses
      # to replace that lifecycle with a simulated Linux updater path.
      - name: Install Linux native updater dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev xvfb xauth dbus-x11

      - name: Install updater E2E dependencies
        run: npm ci

      - name: Configure Linux updater relaunch sandbox
        if: runner.os == 'Linux'
        run: |
          node node_modules/electron/install.js
          sandbox_path="$(find node_modules/electron -maxdepth 4 -name chrome-sandbox -print -quit)"
          if [ -z "$sandbox_path" ]; then
            echo "::error::Electron Linux binary installed without the required chrome-sandbox helper."
            exit 1
          fi
          sandbox_path="$(realpath "$sandbox_path")"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          test "$(stat -c '%U:%G:%a' "$sandbox_path")" = "root:root:4755"
          echo "CHROME_DEVEL_SANDBOX=$sandbox_path" >> "$GITHUB_ENV"
          echo "Configured inherited Electron SUID sandbox helper: $sandbox_path"

      - name: Resolve exact updater target identity
        shell: bash
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RAW_TAG"
          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$tag" =~ $semver_tag_re ]]; then
            echo "::error::Updater E2E requires an exact stable SemVer tag (received: $tag)."
            exit 1
          fi
          tagged_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")" || exit 1
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tagged_commit" ]; then
            echo "::error::Updater E2E checkout does not match $tag."
            exit 1
          fi
          version="${tag#v}"
          pkgver="$(node -p "require('./package.json').version")"
          if [ "$pkgver" != "$version" ]; then
            echo "::error::package.json version $pkgver does not match $tag."
            exit 1
          fi
          echo "RESOLVED_VERSION=$version" >> "$GITHUB_ENV"

      - name: Download exact native release artifact
        uses: actions/download-artifact@v4
        with:
          name: agentlas-release-${{ matrix.artifact_os }}
          path: release

      # A failed release gate can require a verifier correction after an
      # immutable app tag already exists. Keep the app, package metadata, and
      # artifacts checked out from that exact tag while loading only the
      # release verifier from the immutable workflow commit that requested the
      # run. This cannot modify or rebuild the tagged application.
      - name: Checkout immutable release verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.harness_ref || github.sha }}
          path: .release-harness
          sparse-checkout: scripts/test-packaged-updater-install-e2e.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify release verifier identity
        shell: bash
        env:
          EXPECTED_HARNESS_REF: ${{ inputs.harness_ref || github.sha }}
        run: |
          expected="$(git rev-parse --verify "${EXPECTED_HARNESS_REF}^{commit}")"
          actual="$(git -C .release-harness rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Release verifier checkout $actual does not match immutable ref $expected."
            exit 1
          fi
          test -f .release-harness/scripts/test-packaged-updater-install-e2e.cjs

      - name: Run v0.8.32 to target native updater lifecycle
        shell: bash
        env:
          # The harness has a deliberate local-host safety refusal. Actions is
          # the disposable native execution boundary for this destructive test.
          CI: "true"
        run: |
          args=(
            .release-harness/scripts/test-packaged-updater-install-e2e.cjs
            --platform="${{ matrix.platform }}"
            --artifact-dir=release
            --target-version="$RESOLVED_VERSION"
            --timeout-ms=180000
          )
          if [ "${{ matrix.platform }}" = "linux" ]; then
            # Keep X11 and D-Bus alive for the whole verifier process. The
            # updater-launched target inherits these sessions and must boot far
            # enough to reconcile its durable install journal.
            dbus-run-session -- xvfb-run -a node "${args[@]}"
          else
            node "${args[@]}"
          fi
