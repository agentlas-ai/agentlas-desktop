# Cross-platform release — builds Windows / Linux installers and publishes them to
# the SEPARATE PUBLIC releases repo (agentlas-ai/agentlas-desktop) via the
# electron-builder GitHub publisher. The desktop SOURCE repo is private, so only the
# compiled binaries + latest*.yml (the update feed electron-updater polls) are made
# public — no source is exposed.
#
# The embedded Hephaestus engine is git-ignored, so a fresh checkout has no
# engine — `npm run ensure:engine` clones the public engine repo before build.
#
# These builds are UNSIGNED (no Windows certificate required). macOS is
# intentionally excluded here: public Mac releases must come from
# scripts/package-mac.sh with Developer ID signing + notarization, otherwise
# users can get a "newer" DMG that cannot safely auto-update.
# For the signed + notarized macOS pipeline, see docs/PUBLIC-RELEASE.md.
#
# Requires the AGENTLAS_DESKTOP_RELEASE_TOKEN secret (a PAT with `repo` scope that
# can write to the releases repo) — already present in repo secrets.
#
# Trigger:
#   git tag v0.0.3 && git push origin v0.0.3      # version comes from the tag
#   or run "Release" manually from the Actions tab (workflow_dispatch).
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*" # pre-releases: v0.0.3-beta.1
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.0.3). Must match package.json version."
        required: true
        default: "v0.0.3"

# Distribution is to the CDN, not GitHub Releases — read-only checkout suffices.
permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_args: --win
          - os: ubuntu-latest
            builder_args: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HEPHAESTUS_REF: v1.1.13

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # keytar links against libsecret on Linux.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev xvfb dbus-x11

      # Tag must match package.json version so the auto-update feed is consistent.
      - name: Verify tag matches package.json version
        shell: bash
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag="$RAW_TAG"
          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$tag" =~ $semver_tag_re ]]; then
            echo "::error::Release tag must be strict SemVer with a leading v (received: $tag)."
            exit 1
          fi
          tagged_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")" || {
            echo "::error::Release tag $tag does not exist in refs/tags."
            exit 1
          }
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tagged_commit" ]; then
            echo "::error::Checked-out HEAD $head_commit does not match $tag ($tagged_commit)."
            exit 1
          fi
          version="${tag#v}"
          pkgver=$(node -p "require('./package.json').version")
          if [ "$pkgver" != "$version" ]; then
            echo "::error::Tag $tag implies version=$version but package.json is $pkgver. Bump package.json before tagging."
            exit 1
          fi
          echo "RESOLVED_TAG=$tag" >> "$GITHUB_ENV"
          echo "Releasing $tag (version $version)"

      # Clone the git-ignored Hephaestus engine so extraResources can embed it.
      - name: Ensure embedded engine (Hephaestus)
        run: npm run ensure:engine

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        if: runner.os == 'Linux'
        run: npm run typecheck

      - name: Linux migration and updater continuity gates
        if: runner.os == 'Linux'
        run: |
          # Hosted Linux runners need electron's SUID sandbox helper owned by root
          # (mode 4755), otherwise the chromium child aborts with SIGTRAP before any
          # test runs (FATAL:setuid_sandbox_host.cc). This is env setup, not a code fix.
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          # Run the electron gates inside a real X (xvfb) AND a session bus
          # (dbus-run-session). Without a session bus, electron reads
          # DBUS_SESSION_BUS_ADDRESS=disabled and aborts with
          # "Unknown or unsupported transport 'disabled'". One session for all gates.
          xvfb-run -a dbus-run-session -- bash -eo pipefail -c '
            npm run test:v52-automation-run-recovery
            npm run test:v53-hub-bookmark-sync
            npm run test:updater-production
            npm run test:automations-store
            npm run test:borrowed-task-force
            npm run test:mcp-auto-select
            npm run test:mcp-secret-isolation
          '

      - name: Build renderer + electron
        run: npm run build

      # --publish always uploads installers + the update feed (latest*.yml) to the
      # public releases repo (per electron-builder.yml publish config). Retried
      # because installer creation flakes intermittently on hosted runners.
      - name: Package and publish
        shell: bash
        env:
          # Publishing to the separate public releases repo requires a cross-repo
          # PAT. Keep it out of npm install, builds, and regression tests.
          GH_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::electron-builder attempt $attempt"
            if npx electron-builder ${{ matrix.builder_args }} --publish always; then
              # electron-builder writes latest*.yml only after artifact-build hooks,
              # so compatibility must be stamped after the builder process exits.
              # Re-uploading only the feed with --clobber keeps installer publishing
              # unchanged while making the final public feed authoritative.
              node scripts/stamp-update-feeds.mjs --release-dir=release --require
              mapfile -t update_feeds < <(find release -maxdepth 1 -type f -name 'latest*.yml' -print | sort)
              if gh release upload "$RESOLVED_TAG" \
                --repo agentlas-ai/agentlas-desktop-releases \
                --clobber \
                "${update_feeds[@]}"; then
                echo "::endgroup::"
                exit 0
              fi
              echo "::warning::compatibility feed upload failed; retrying the release attempt"
            fi
            echo "::endgroup::"
            echo "::warning::release attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::build/publish/feed verification failed after 3 attempts"
          exit 1
