# Cross-platform release build — verifies and packages Windows / Linux into
# GitHub Actions artifacts only. It never writes the public releases repository.
# The signed macOS workflow consumes these artifacts after every OS gate passes
# and owns the single atomic staging/promotion boundary.
#
# The embedded Hephaestus engine is git-ignored, so a fresh checkout has no
# engine — `npm run ensure:engine` clones the public engine repo before build.
#
# These builds are UNSIGNED (no Windows certificate required). macOS is
# intentionally excluded here: public Mac releases must come from
# scripts/package-mac.sh with Developer ID signing + notarization, otherwise
# users can get a "newer" DMG that cannot safely auto-update.
# For the signed + notarized macOS pipeline, see docs/PUBLIC-RELEASE.md.
#
# A manual run is build-only; it cannot publish a release.
name: Cross-platform Release Build

on:
  workflow_call:
    inputs:
      tag:
        description: "Exact stable public release tag"
        required: true
        type: string
      source_ref:
        description: "Exact immutable source commit SHA to package"
        required: true
        type: string
      harness_ref:
        description: "Immutable workflow commit that supplies release-only verification code"
        required: true
        type: string
    secrets:
      AGENTLAS_DESKTOP_RELEASE_TOKEN:
        description: "Scoped GitHub token for the pinned private Science dependency"
        required: true

permissions:
  contents: read

jobs:
  build-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            builder_args: --win
          - os: ubuntu-24.04
            builder_args: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Public verification keys only; absence blocks packaging before release.
      AGENTLAS_PRODUCT_EXTENSION_TRUSTED_KEYS_JSON: ${{ vars.AGENTLAS_PRODUCT_EXTENSION_TRUSTED_KEYS_JSON }}
      HEPHAESTUS_REF: v1.2.44
      HEPHAESTUS_COMMIT: 1f6d64374502cfd5f8581ad3c1fb18691ed61b1d
      HEPHAESTUS_ASSET_NAME: hephaestus-runtime-v1.2.44.tar.gz
      HEPHAESTUS_ASSET_SHA256: 795d1c294db662475d4eb0c7e4562ba0ca1e0f27d3b1da0f5e9c6e7cf627d83a

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: package-lock.json

      # keytar links against libsecret on Linux.
      # ★이 한 줄이 릴리스를 두 번 통째로 죽였다(실측 2026-08-19/20). Linux 잡이 45분
      #   타임아웃에 걸려 취소되고, 그 취소가 "All OS release gate barrier" 를 실패시켜
      #   서명 빌드가 아예 시작되지 않았다. 7월까지 이 잡은 10분이었으니 느려진 것이
      #   아니라 **멈춘 것**이다(apt 가 프롬프트나 죽은 미러를 기다린다).
      #   그래서 셋을 건다: 대화형 금지, 받기 재시도·상한, 그리고 이 단계 자체의 상한 —
      #   막히면 45분을 먹지 않고 여기서 이유를 말하며 끝난다.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            libsecret-1-dev xvfb dbus-x11

      - name: Verify release identity
        shell: bash
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          tag="$RAW_TAG"
          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$tag" =~ $semver_tag_re ]]; then
            echo "::error::Release tag must be stable SemVer with a leading v and no prerelease suffix (received: $tag)."
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || [ "$head_commit" != "$SOURCE_REF" ]; then
            echo "::error::Checked-out HEAD $head_commit does not match immutable source commit $SOURCE_REF."
            exit 1
          fi
          version="${tag#v}"
          pkgver=$(node -p "require('./package.json').version")
          lockver=$(node -p "require('./package-lock.json').version")
          lockrootver=$(node -p "require('./package-lock.json').packages[''].version")
          runtimever=$(node -p "require('./package.json').agentlasUpdateCompatibility.bundledRuntimeVersion")
          runtimecommit=$(node -p "require('./package.json').agentlasBundledRuntimeSource.commit")
          runtimeasset=$(node -p "require('./package.json').agentlasBundledRuntimeSource.assetName")
          runtimedigest=$(node -p "require('./package.json').agentlasBundledRuntimeSource.assetSha256")
          if [ "$pkgver" != "$version" ] || [ "$lockver" != "$version" ] || [ "$lockrootver" != "$version" ]; then
            echo "::error::Tag $tag requires package.json/package-lock root version=$version (got package=$pkgver lock=$lockver root=$lockrootver)."
            exit 1
          fi
          if [ "${HEPHAESTUS_REF#v}" != "$runtimever" ]; then
            echo "::error::HEPHAESTUS_REF=$HEPHAESTUS_REF does not match bundledRuntimeVersion=$runtimever."
            exit 1
          fi
          if [ "$HEPHAESTUS_COMMIT" != "$runtimecommit" ]; then
            echo "::error::HEPHAESTUS_COMMIT does not match package immutable runtime pin."
            exit 1
          fi
          if [ "$HEPHAESTUS_ASSET_NAME" != "$runtimeasset" ] || [ "$HEPHAESTUS_ASSET_SHA256" != "$runtimedigest" ]; then
            echo "::error::Agentlas OS release asset name/digest does not match package immutable runtime pin."
            exit 1
          fi
          echo "RESOLVED_TAG=$tag" >> "$GITHUB_ENV"
          echo "Releasing $tag (version $version)"

      # Clone the git-ignored Hephaestus engine so extraResources can embed it.
      - name: Ensure embedded engine (Hephaestus)
        run: npm run ensure:engine

      - name: Checkout pinned private release verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: agentlas-ai/agentlas-science
          ref: da893984b3ab0254e55557734c1010f3d3ba3935
          token: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
          path: .release-private-verification
          sparse-checkout: release-verification/desktop
          persist-credentials: false

      - name: Install hash-bound private verification files
        shell: bash
        run: |
          test "$(git -C .release-private-verification rev-parse HEAD)" = "da893984b3ab0254e55557734c1010f3d3ba3935"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const source = '.release-private-verification/release-verification/desktop';
          const manifest = JSON.parse(fs.readFileSync(path.join(source, 'manifest.json'), 'utf8'));
          if (manifest.schema !== 'agentlas.private-release-verification.v1' || !Array.isArray(manifest.files)) throw new Error('Invalid private verification manifest');
          const seen = new Set();
          for (const entry of manifest.files) {
            if (!/^scripts\/(?:[A-Za-z0-9_-]+\/)*[A-Za-z0-9_.-]+$/.test(entry.path) || entry.path.includes('..') || seen.has(entry.path)) throw new Error('Invalid verification path');
            seen.add(entry.path);
            const bytes = require('node:child_process').execFileSync('git', ['-C', '.release-private-verification', 'show', `da893984b3ab0254e55557734c1010f3d3ba3935:release-verification/desktop/${entry.path}`]);
            if (crypto.createHash('sha256').update(bytes).digest('hex') !== entry.sha256) throw new Error('Verification file digest mismatch');
            fs.mkdirSync(path.dirname(entry.path), { recursive: true });
            fs.writeFileSync(entry.path, bytes);
          }
          console.log(`Installed ${seen.size} private verification files from the pinned release`);
          NODE

      - name: Install dependencies
        shell: bash
        env:
          AGENTLAS_SCIENCE_GITHUB_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
        run: |
          git_config="$RUNNER_TEMP/agentlas-science-gitconfig"
          trap 'rm -f "$git_config"' EXIT
          test -n "$AGENTLAS_SCIENCE_GITHUB_TOKEN"
          umask 077
          cat > "$git_config" <<EOF
          [url "https://x-access-token:${AGENTLAS_SCIENCE_GITHUB_TOKEN}@github.com/agentlas-ai/agentlas-science.git"]
              insteadOf = ssh://git@github.com/agentlas-ai/agentlas-science.git
              insteadOf = git+ssh://git@github.com/agentlas-ai/agentlas-science.git
              insteadOf = git@github.com:agentlas-ai/agentlas-science.git
          EOF
          GIT_CONFIG_GLOBAL="$git_config" npm ci --no-audit

      - name: Fetch SHA-256-pinned standalone Python for the package
        run: npm run fetch:python

      - name: Verify portable Linux updater contracts
        if: runner.os == 'Linux'
        env:
          AGENTLAS_E2E: "1"
        run: |
          node node_modules/electron/install.js
          sandbox_path="$(find node_modules/electron -maxdepth 4 -name chrome-sandbox -print -quit)"
          if [ -z "$sandbox_path" ]; then
            echo "::error::Electron Linux binary installed without the required chrome-sandbox helper."
            exit 1
          fi
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          echo "Configured Electron SUID sandbox helper: $sandbox_path"
          xvfb-run -a dbus-run-session -- bash -eo pipefail -c '
            npm run build:electron
          '

      - name: Build renderer + electron
        run: npm run build

      # Tests run after the initial clone. Recheck the immutable commit and the
      # ignored-file boundary immediately before electron-builder sees Core.
      - name: Reverify embedded engine release boundary
        run: npm run ensure:engine

      # Tests and native rebuilds run for several minutes after the first
      # fetch. Re-materialize the immutable platform asset at the final package
      # boundary so no stale/cross-arch directory can reach electron-builder.
      - name: Reverify pinned standalone Python at package boundary
        run: npm run fetch:python

      # electron-builder's afterPack gate requires the same checksum-pinned
      # Chrome for Testing tree that ships in the app. Materialize it at the
      # final package boundary on each native runner so Windows/Linux cannot
      # reach packaging with only the repository .gitkeep placeholder.
      - name: Materialize pinned browser runtime for package boundary
        run: npm run fetch:browser

      # 맥도 받아야 한다. 예전에는 이 단계가 `runner.os == 'Windows'` 였고, 그래서 맥
      # 배포판에는 앱이 들고 다닐 Node 가 아예 실리지 않았다 — Node 가 없는 맥 사용자에게
      # CLI 설치 버튼이 "npm 을 찾을 수 없습니다"로 끝나던 원인이다.
      - name: Materialize pinned private Node runtime for CLI bootstrap
        run: npm run fetch:node

      - name: Package verified Actions artifacts only
        shell: bash
        run: |
          npx electron-builder ${{ matrix.builder_args }} --publish never
          node scripts/stamp-update-feeds.mjs --release-dir=release --require

      - name: Verify packaged Windows Python and Workforce MCP
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/verify-packaged-workforce-runtime.cjs --resources=release/win-unpacked/resources

      - name: Verify packaged Linux Python and Workforce MCP
        if: runner.os == 'Linux'
        shell: bash
        run: node scripts/verify-packaged-workforce-runtime.cjs --resources=release/linux-unpacked/resources

      - name: Upload Windows/Linux package set for the release barrier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentlas-release-${{ runner.os }}
          path: |
            release/Agentlas-*-Windows-x64-Setup.exe
            release/Agentlas-*-Windows-x64-Setup.exe.blockmap
            release/Agentlas-*-Windows-x64-Portable.exe
            release/Agentlas-*-Linux-x64.AppImage
            release/Agentlas-*-Linux-x64.deb
            release/latest.yml
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 3

  # Package/unit contracts cannot prove that a previous installed release can
  # actually download, replace itself, restart, and reconcile its durable
  # journal. Exercise that lifecycle on the native target OS before the
  # reusable workflow can satisfy the all-OS public-release barrier.

  updater-install-e2e:
    name: Native updater install E2E (${{ matrix.label }})
    needs: build-cross-platform
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win32
            artifact_os: Windows
            label: Windows NSIS
          - os: ubuntu-24.04
            platform: linux
            artifact_os: Linux
            label: Linux AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: package-lock.json

      # The test launches a real AppImage under a virtual display. It refuses
      # to replace that lifecycle with a simulated Linux updater path.
      - name: Install Linux native updater dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev xvfb xauth dbus-x11

      - name: Checkout pinned private release verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: agentlas-ai/agentlas-science
          ref: da893984b3ab0254e55557734c1010f3d3ba3935
          token: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
          path: .release-private-verification
          sparse-checkout: release-verification/desktop
          persist-credentials: false

      - name: Install hash-bound private verification files
        shell: bash
        run: |
          test "$(git -C .release-private-verification rev-parse HEAD)" = "da893984b3ab0254e55557734c1010f3d3ba3935"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const source = '.release-private-verification/release-verification/desktop';
          const manifest = JSON.parse(fs.readFileSync(path.join(source, 'manifest.json'), 'utf8'));
          if (manifest.schema !== 'agentlas.private-release-verification.v1' || !Array.isArray(manifest.files)) throw new Error('Invalid private verification manifest');
          const seen = new Set();
          for (const entry of manifest.files) {
            if (!/^scripts\/(?:[A-Za-z0-9_-]+\/)*[A-Za-z0-9_.-]+$/.test(entry.path) || entry.path.includes('..') || seen.has(entry.path)) throw new Error('Invalid verification path');
            seen.add(entry.path);
            const bytes = require('node:child_process').execFileSync('git', ['-C', '.release-private-verification', 'show', `da893984b3ab0254e55557734c1010f3d3ba3935:release-verification/desktop/${entry.path}`]);
            if (crypto.createHash('sha256').update(bytes).digest('hex') !== entry.sha256) throw new Error('Verification file digest mismatch');
            fs.mkdirSync(path.dirname(entry.path), { recursive: true });
            fs.writeFileSync(entry.path, bytes);
          }
          console.log(`Installed ${seen.size} private verification files from the pinned release`);
          NODE

      - name: Install updater E2E dependencies
        shell: bash
        env:
          AGENTLAS_SCIENCE_GITHUB_TOKEN: ${{ secrets.AGENTLAS_DESKTOP_RELEASE_TOKEN }}
        run: |
          git_config="$RUNNER_TEMP/agentlas-science-gitconfig"
          trap 'rm -f "$git_config"' EXIT
          test -n "$AGENTLAS_SCIENCE_GITHUB_TOKEN"
          umask 077
          cat > "$git_config" <<EOF
          [url "https://x-access-token:${AGENTLAS_SCIENCE_GITHUB_TOKEN}@github.com/agentlas-ai/agentlas-science.git"]
              insteadOf = ssh://git@github.com/agentlas-ai/agentlas-science.git
              insteadOf = git+ssh://git@github.com/agentlas-ai/agentlas-science.git
              insteadOf = git@github.com:agentlas-ai/agentlas-science.git
          EOF
          GIT_CONFIG_GLOBAL="$git_config" npm ci --no-audit

      - name: Configure Linux updater relaunch sandbox
        if: runner.os == 'Linux'
        run: |
          node node_modules/electron/install.js
          sandbox_path="$(find node_modules/electron -maxdepth 4 -name chrome-sandbox -print -quit)"
          if [ -z "$sandbox_path" ]; then
            echo "::error::Electron Linux binary installed without the required chrome-sandbox helper."
            exit 1
          fi
          sandbox_path="$(realpath "$sandbox_path")"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          test "$(stat -c '%U:%G:%a' "$sandbox_path")" = "root:root:4755"
          echo "CHROME_DEVEL_SANDBOX=$sandbox_path" >> "$GITHUB_ENV"
          echo "Configured inherited Electron SUID sandbox helper: $sandbox_path"

      - name: Resolve exact updater target identity
        shell: bash
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          tag="$RAW_TAG"
          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$tag" =~ $semver_tag_re ]]; then
            echo "::error::Updater E2E requires an exact stable SemVer tag (received: $tag)."
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || [ "$head_commit" != "$SOURCE_REF" ]; then
            echo "::error::Updater E2E checkout does not match immutable source commit."
            exit 1
          fi
          version="${tag#v}"
          pkgver="$(node -p "require('./package.json').version")"
          if [ "$pkgver" != "$version" ]; then
            echo "::error::package.json version $pkgver does not match $tag."
            exit 1
          fi
          echo "RESOLVED_VERSION=$version" >> "$GITHUB_ENV"

      - name: Download exact native release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agentlas-release-${{ matrix.artifact_os }}
          path: release

      # Keep the app, package metadata, and artifacts checked out from the exact
      # immutable source commit while loading only the release verifier from the
      # workflow commit that requested the run.
      - name: Checkout immutable release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.harness_ref || github.sha }}
          path: .release-harness
          sparse-checkout: scripts/verify-packaged-updater-install-e2e.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify release verifier identity
        shell: bash
        env:
          EXPECTED_HARNESS_REF: ${{ inputs.harness_ref || github.sha }}
        run: |
          expected="$(git rev-parse --verify "${EXPECTED_HARNESS_REF}^{commit}")"
          actual="$(git -C .release-harness rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Release verifier checkout $actual does not match immutable ref $expected."
            exit 1
          fi
          test -f .release-harness/scripts/verify-packaged-updater-install-e2e.cjs

      - name: Run v0.8.32 to target native updater lifecycle
        shell: bash
        env:
          # The harness has a deliberate local-host safety refusal. Actions is
          # the disposable native execution boundary for this destructive test.
          CI: "true"
        run: |
          args=(
            .release-harness/scripts/verify-packaged-updater-install-e2e.cjs
            --platform="${{ matrix.platform }}"
            --artifact-dir=release
            --target-version="$RESOLVED_VERSION"
            --timeout-ms=180000
          )
          if [ "${{ matrix.platform }}" = "linux" ]; then
            # Keep X11 and D-Bus alive for the whole verifier process. The
            # updater-launched target inherits these sessions and must boot far
            # enough to reconcile its durable install journal.
            dbus-run-session -- xvfb-run -a node "${args[@]}"
          else
            node "${args[@]}"
          fi
